- generic [active] [ref=e1]: "{\"query\":\"flame spread\",\"page\":1,\"pageSize\":3,\"total\":311,\"totalIsEstimate\":false,\"results\":[{\"id\":\"20200000557\",\"canonicalUrl\":\"https://ntrs.nasa.gov/citations/20200000557\",\"title\":\"Buoyancy Effects on Concurrent Flame Spread Over Thick PMMA\",\"abstract\":\"The flammability of combustible materials in a spacecraft is important for fire safety applications because the conditions in spacecraft environments differ from those on earth. Experimental testing in space is difficult and expensive. However, reducing buoyancy by decreasing ambient pressure is a possible approach to simulate on-earth the burning behavior inside spacecraft environments. The objective of this work is to determine that possibility by studying the effect of pressure on concurrent flame spread, and by comparison with microgravity data, observe up to what point low-pressure can be used to replicate flame spread characteristics observed in microgravity. Specifically, this work studies the effect of pressure and microgravity on upward/concurrent flame spread over 10 mm thick polymethyl methacrylate (PMMA) slabs. Experiments in normal gravity were conducted over pressures ranging between 100 and 40 kPa and a forced flow velocity of 200 mm/s. Microgravity experiments were conducted during NASA’s Spacecraft Fire Experiment (Saffire II), on board the Cygnus spacecraft at 100 kPa with an air flow velocity of 200 mm/s. Results show that reductions of pressure slow down the flame spread over the PMMA surface approaching that in microgravity. The data is correlated in terms of a non-dimensional mixed convection analysis that describes the convective heat transferred from the flame to the solid, and the primary mechanism controlling the spread of the flame. The extrapolation of the correlation to low pressures predicts well the flame spread rate obtained in microgravity in the Saffire II experiments. Similar results were obtained by the authors with similar experiments with a thin composite cotton/fiberglass fabric (published elsewhere). Both results suggest that reduced pressure can be used to approximately replicate flame behavior of untested gravity conditions for the burning of thick and thin solids. This work could provide guidance for potential ground-based testing for fire safety design in spacecraft and space habitats.\",\"authors\":[\"Maria Thomsen\",\"Carlos Fernandez-Pello\",\"Gary A. Ruff\",\"David L. Urban\"],\"publicationDate\":\"2018-11-05T05:00:00.0000000+00:00\",\"doi\":\"https://doi.org/10.1016/j.combustflame.2018.10.016\",\"documentType\":\"Accepted Manuscript (Version with final changes)\",\"center\":\"Glenn Research Center\",\"subjectCategories\":[\"Inorganic, Organic And Physical Chemistry\"],\"fullTextLinks\":[{\"label\":\"PDF\",\"url\":\"https://ntrs.nasa.gov/api/citations/20200000557/downloads/20200000557.pdf\"},{\"label\":\"Full text\",\"url\":\"https://ntrs.nasa.gov/api/citations/20200000557/downloads/20200000557.txt\"}]},{\"id\":\"20205004657\",\"canonicalUrl\":\"https://ntrs.nasa.gov/citations/20205004657\",\"title\":\"Effects of Confinement on Flame Spread in Microgravity\",\"abstract\":\"Solid fuel combustion experiments aboard the ISS examine the effects of confinement on a concurrent, purely-forced-flow flame spread in microgravity environment. The results for a thin, cotton-fiberglass-blended textile fabric fuel are presented. Flat baffles of differing materials are used to alter the radiative boundary conditions with transparent polycarbonate, black anodized aluminum (reflectance ~ 0), and highly polished aluminum (reflectance ~ 1). The baffles are parallel to the fuel sheet and placed symmetrically on each side. The inter-baffle distance is varied to change the boundary conditions for the flow. In all tests, samples are ignited at the upstream leading edge and allowed to burn to completion. Results show that the flame reaches a steady length and spread rate at low flow speeds (< 15 cm/s) for all tested inter-baffle distances. As the distance decreases, the flame length and spread rate first increase then decrease showing an optimal inter-baffle distance. For all baffle types, the flame either fails to ignite or extinguishes before reaching the end of the sample when the inter-baffle distance is too small (~ 1 cm). This is attributed to the reduction of oxygen supply to the flame zone and heat loss to the baffles. The results also show at the same inter-baffle distance, flame length and spread rate are highest for polished aluminum baffles, and lowest for transparent polycarbonate baffles. The differences are most prominent at intermediate tested baffle distances. While the radiative heat feedback from the baffles is expected to increase when the baffle distance decreases, the combustion is limited by the reduced oxygen supply. Near this limit, flame lengths and spread rates are similar for all baffle types.\",\"authors\":[\"Yanjun Li\",\"Ya-Ting T Liao\",\"Paul V Ferkul\",\"Michael C Johnston\",\"Charles Bunnell\"],\"documentType\":\"Conference Paper\",\"center\":\"Glenn Research Center\",\"subjectCategories\":[\"Space Sciences (General)\"],\"fullTextLinks\":[{\"label\":\"PDF\",\"url\":\"https://ntrs.nasa.gov/api/citations/20205004657/downloads/ICES-2020-407-final.pdf\"},{\"label\":\"Full text\",\"url\":\"https://ntrs.nasa.gov/api/citations/20205004657/downloads/ICES-2020-407-final.pdf.txt\"}]},{\"id\":\"19970020615\",\"canonicalUrl\":\"https://ntrs.nasa.gov/citations/19970020615\",\"title\":\"Flame Attachment in Flame Spread\",\"abstract\":\"Flame attachment is a subject that can be studied in many contexts and which has a relatively long history. All diffusion flames are ultimately attached somewhere along their length to one or more surfaces. Depending on the type of particular application, the attachment region may be important to the behavior of the entire flame. Flame spread over solid fuels is ones area in which flame attachment is apparently of central importance. It is widely believed, through it has not yet beer conclusively demonstrated, that the attachment region-alternately called the 'flame tip,' 'flame foot,' 'attachment point,' and etc. -controls the entire spread process. Flame spread is an important problem for both practical and academic reasons. On the practical level, one wishes to prevent or, at worst, control unwanted flame spread over combustible materials; to know what levels of heat flux are necessary to sustain flame spreading once it has begun; to design materials that are as minimally hazardous as possible; and to devise extinguishment methods that are both sound and useful. Academically, flame spread is one of the most difficult problems of combustion theory, combining a fully interacting multidimensional transient gas and solid phase problem with chemistry, heat transfer, radiation and material properties that may change during spreading. For this reason, it has been a challenge for scores of combustion researchers.\",\"authors\":[\"Indrek S Wichman\",\"Bassem Ramadan\"],\"publicationDate\":\"1997-05-01T04:00:00.0000000+00:00\",\"documentType\":\"Conference Paper\",\"center\":\"Glenn Research Center\",\"subjectCategories\":[\"Inorganic, Organic and Physical Chemistry\"],\"fullTextLinks\":[]}],\"facets\":{\"stiTypes\":[{\"value\":\"CONFERENCE_PAPER\",\"count\":145},{\"value\":\"OTHER\",\"count\":32},{\"value\":\"REPRINT\",\"count\":30},{\"value\":\"ACCEPTED_MANUSCRIPT\",\"count\":20},{\"value\":\"PRESENTATION\",\"count\":19},{\"value\":\"CONFERENCE_PROCEEDINGS\",\"count\":16},{\"value\":\"CONTRACTOR_REPORT\",\"count\":11},{\"value\":\"PREPRINT\",\"count\":11},{\"value\":\"TECHNICAL_MEMORANDUM\",\"count\":10},{\"value\":\"ABSTRACT\",\"count\":7},{\"value\":\"CONTRACTOR_OR_GRANTEE_REPORT\",\"count\":2},{\"value\":\"EXTENDED_ABSTRACT\",\"count\":2},{\"value\":\"POSTER\",\"count\":2},{\"value\":\"THESIS_DISSERTATION\",\"count\":2},{\"value\":\"CONFERENCE_PUBLICATION\",\"count\":1},{\"value\":\"WHITE_PAPER\",\"count\":1}],\"centers\":[{\"value\":\"GRC\",\"count\":156},{\"value\":\"CDMS\",\"count\":122},{\"value\":\"HQ\",\"count\":3},{\"value\":\"MSFC\",\"count\":3},{\"value\":\"ARC\",\"count\":2},{\"value\":\"JSC\",\"count\":1}],\"subjectCategories\":[{\"value\":\"Inorganic And Physical Chemistry\",\"count\":50},{\"value\":\"Inorganic, Organic And Physical Chemistry\",\"count\":42},{\"value\":\"Materials Processing\",\"count\":35},{\"value\":\"Fluid Mechanics And Thermodynamics\",\"count\":22},{\"value\":\"Space Transportation And Safety\",\"count\":14},{\"value\":\"Propellants And Fuels\",\"count\":12},{\"value\":\"Chemistry And Materials (General)\",\"count\":11},{\"value\":\"Inorganic, Organic and Physical Chemistry\",\"count\":10},{\"value\":\"Nonmetallic Materials\",\"count\":10},{\"value\":\"Composite Materials\",\"count\":8},{\"value\":\"Space Processing\",\"count\":8},{\"value\":\"Space Sciences (General)\",\"count\":8},{\"value\":\"Thermodynamics And Combustion\",\"count\":6},{\"value\":\"Astronautics (General)\",\"count\":5},{\"value\":\"Energy Production And Conversion\",\"count\":5},{\"value\":\"Fluid Mechanics And Heat Transfer\",\"count\":5},{\"value\":\"Spacecraft Design, Testing And Performance\",\"count\":5},{\"value\":\"Engineering (General)\",\"count\":4},{\"value\":\"Mechanical Engineering\",\"count\":3},{\"value\":\"Aeronautics (General)\",\"count\":2}]},\"partial\":false,\"skippedRecords\":0}"