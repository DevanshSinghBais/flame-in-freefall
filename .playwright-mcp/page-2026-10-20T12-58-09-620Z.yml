          - generic [ref=f5e171]: Illustrative visualization
        - paragraph [ref=f5e173]: On Earth, gravity-driven buoyant convection shapes a candle flame into a teardrop and carries soot toward its tip. In microgravity, with convective flows absent, NASA describes a spherical, soot-free, blue flame.
