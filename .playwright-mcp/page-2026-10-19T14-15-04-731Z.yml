erType\":\"CONTRACTOR_GRANTEE\",\"userId\":\"239bc3229655455ead89d4df7bbafb07\"}],\"stiTypeDetails\":\"Accepted Manuscript (Version with final changes)\",\"technicalReviewType\":\"NASA_PEER_COMMITTEE\",\"modified\":\"2025-08-31T18:39:21.7150190+00:00\",\"id\":20240000311,\"created\":\"2024-01-09T16:14:25.6585800+00:00\",\"center\":{\"code\":\"GSFC\",\"name\":\"Goddard Space Flight Center\",\"id\":\"973fae00c3584b9fb4c762ae9870d0f6\"},\"onlyAbstract\":false,\"sensitiveInformation\":2,\"abstract\":\"Attribution of datasets that were used to generate research results described in peer-reviewed publications to the original source of these datasets (which are often archived at NASA Earth Science data centers) has been very challenging. Even though the data citation standard of citing datasets as research artifacts and citing them with Digital Object Identifiers (DOIs) was introduced over a decade ago, most authors do not properly reference the data used in their studies and merely mention them in the text. The lack of proper citations of datasets makes the peer-reviewed publication less transparent, imperils reproducibility, and impedes open science. We offer an open-source publication management methodology and a tool that can help to enhance usage-based data discovery, prominence, and provenance of the data; reproducibility of the research results; and potentially increase the return on investment on NASA-funded research.\",\"isLessonsLearned\":true,\"disseminated\":\"DOCUMENT_AND_METADATA\",\"cui\":{\"isCui\":false,\"submissionId\":20240000311,\"id\":\"6568a66a50a04102bc990b56dc2aeab2\"},\"publications\":[{\"volume\":\"23\",\"submissionId\":20240000311,\"issn\":\"\",\"publisher\":\"Ubiquity Press (United Kingdom)\",\"eissn\":\"1683-1470\",\"id\":\"600e950bee7943f886e6fde753d93463\",\"publicationName\":\"Data Science Journal\",\"publicationDate\":\"2024-01-12T06:00:00.0000000+00:00\",\"issuePublicationDate\":\"2024-01-01T06:00:00.0000000+00:00\",\"url\":\"\",\"doi\":\"10.5334/dsj-2024-001\"}],\"status\":\"CURATED\",\"related\":[],\"downloads\":[{\"draft\":false,\"mimetype\":\"application/pdf\",\"name\":\"Research Publications.pdf\",\"type\":\"STI\",\"links\":{\"original\":\"/api/citations/20240000311/downloads/Research%20Publications.pdf\",\"pdf\":\"/api/citations/20240000311/downloads/Research%20Publications.pdf\",\"fulltext\":\"/api/citations/20240000311/downloads/Research%20Publications.pdf.txt\"}}],\"downloadsAvailable\":true,\"index\":\"submissions-2026-10-15-05-24\"}"