      - generic [ref=f1e33]:
        - generic [ref=f1e34]:
          - paragraph [ref=f1e35]: The NASA Technical Reports Server (NTRS) provides access to NASA metadata records, full-text online documents, images, and videos. The types of information included are conference papers, journal articles, meeting papers, patents, research reports, images, movies, and technical videos – scientific and technical information (STI) created or funded by NASA.
          - paragraph [ref=f1e36]: By maintaining NTRS, the STI Program supports NASA’s strategic goals to
          - list [ref=f1e37]:
            - listitem [ref=f1e38]: Expand the frontiers of knowledge, capability, and opportunity in space.
            - listitem [ref=f1e39]: Advance understanding of Earth and develop technologies to improve the quality of life on our home planet.
            - listitem [ref=f1e40]: Serve the American public and accomplish our Mission by effectively managing our people, technical capabilities, and infrastructure.
          - paragraph [ref=f1e41]: We invite you to begin searching NTRS.
          - generic [ref=f1e42]:
            - heading "Please See" [level=2] [ref=f1e43]
            - paragraph [ref=f1e44]:
              - link "NASA Disclaimers, Copyright Notice, and Terms and Conditions of Use" [ref=f1e45] [cursor=pointer]:
                - /url: https://sti.nasa.gov/disclaimers/
              - text: for information on how to use NASA’s scientific and technical information.
            - heading "Contact Us" [level=2] [ref=f1e46]
            - paragraph [ref=f1e47]:
              - text: Please contact the
              - link "NASA STI Information Desk" [ref=f1e48] [cursor=pointer]:
                - /url: https://sti.nasa.gov/contact-us/
              - text: for more information or question.
        - link "Start Search" [ref=f1e50] [cursor=pointer]:
          - /url: /search
