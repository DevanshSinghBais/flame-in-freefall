      - generic [ref=f1e55]:
        - generic [ref=f1e56]:
          - paragraph [ref=f1e57]: Registered content in the NASA Technical Reports Server-Registered (NTRS-R) includes the complete STI collection of NASA and non-NASA aerospace materials and is available to NASA civil servants, contractors, and grantees.
          - paragraph [ref=f1e58]: Members of the NASA community – NASA civil servants, contractors, and grantees - who have access to registered content in NTRS can use the sign-in button to authenticate via their Agency launchpad credentials. Registered content includes the complete STI collection.
          - paragraph [ref=f1e59]:
            - text: NASA civil servants, contractors, and grantees who need access to registered content in the repository, please visit
            - link "https://nasa.sharepoint.com/sites/NASASTIProgram/SitePages/NTRS-Registered-Content.aspx" [ref=f1e60] [cursor=pointer]:
              - /url: https://nasa.sharepoint.com/sites/NASASTIProgram/SitePages/NTRS-Registered-Content.aspx
            - text: .
          - paragraph [ref=f1e61]:
            - text: Access to registered content is managed through the
            - link "NASA Application Management System (NAMS)" [ref=f1e62] [cursor=pointer]:
              - /url: https://nams.nasa.gov/
            - text: and requires an established NASA Agency User Identity (AUID) and a NASA Launchpad password.
