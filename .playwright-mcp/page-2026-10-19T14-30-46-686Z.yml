              - article [ref=e516]:
                - generic [aria-hidden] [ref=e517]: "05"
                - generic [ref=e518]:
                  - generic [ref=e519]:
                    - heading [level=4] [ref=e520]:
                      - link "Flame Spread Across Liquids" [ref=e521] [cursor=pointer]:
                        - /url: /research/19970020607
                    - generic [ref=e522]: Conference Paper
                  - paragraph [ref=e523]: The principal goal of our recent research on flame spread across liquid pools is the detailed identification of the mechanisms that control the rate and nature of flame spread when the liquid pool is initially at an isothermal bulk temperature that is below the fuel's flash point temperature. In our project, we specialize the subject to highlight the roles of buoyancy-related processes regarding the mechanisms of flame spread, an area of research cited recently by Linan and Williams as one that needs further attention and which microgravity (micro-g) experiments could help to resolve. Toward resolving the effects of buoyancy on this flame spread problem, comparisons - between 1-g and micro-g experimental observations, and between model predictions and experimental data at each of these gravitational levels - are extensively utilized. The present experimental and computational foundation is presented to support identification of the mechanisms that control flame spread in the pulsating flame spread regime for which long-duration, micro-g flame spread experiments have been conducted aboard a sounding rocket.
                  - generic [ref=e524]:
                    - generic [ref=e525]: Ross, Howard D.; Miller, Fletcher J.; Sirignano, William A.; Schiller, David
                    - generic [ref=e526]: 1997-05-01
                    - generic [ref=e527]: Glenn Research Center
                  - generic [ref=e528]:
                    - generic [ref=e529]: NASA NTRS ID 19970020607
                    - link "View record details" [ref=e530] [cursor=pointer]:
                      - /url: /research/19970020607
                - link "Open Flame Spread Across Liquids on NASA NTRS" [ref=e533] [cursor=pointer]:
                  - /url: https://ntrs.nasa.gov/citations/19970020607
              - article [ref=e537]:
                - generic [aria-hidden] [ref=e538]: "06"
                - generic [ref=e539]:
                  - generic [ref=e540]:
                    - heading [level=4] [ref=e541]:
                      - link "Flame Spread Along Free Edges of Thermally Thin Samples in Microgravity" [ref=e542] [cursor=pointer]:
                        - /url: /research/20060050783
                    - generic [ref=e543]: Conference Paper
                  - paragraph [ref=e544]: "The effects of imposed flow velocity on flame spread along open edges of a thermally thin cellulosic sample in microgravity were studied experimentally and theoretically. In this study, the sample was ignited locally at the middle of the 4 cm wide sample, and subsequent flame spread reached both open edges of the sample along the direction of the flow. The following flame behaviors were observed in the experiments and predicted by the numerical calculation, in order of increased imposed flow velocity: (1) ignition but subsequent flame spread was not attained, (2) flame spread upstream (opposed mode) without any downstream flame, and (3) the upstream flame and two separate downstream flames traveled along the two open edges (concurrent mode). Generally, the upstream and downstream edge flame spread rates were faster than the central flame spread rate for an imposed flow velocity of up to 5 cm/s. This was due to greater oxygen supply from the outer free stream to the edge flames and more efficient heat transfer from the edge flames to the sample surface than the central flames. For the upstream edge flame, flame spread rate was nearly independent of, or decreased gradually with, the imposed flow velocity. The spread rate of the downstream edge, however, increased significantly with the imposed flow velocity."
                  - generic [ref=e545]:
                    - generic [ref=e546]: Mell, W E; Olson, S L; Kashiwagi, T
                    - generic [ref=e547]: 2000-08-04
                    - generic [ref=e548]: Glenn Research Center
                  - generic [ref=e549]:
                    - generic [ref=e550]: NASA NTRS ID 20060050783
                    - link "View record details" [ref=e551] [cursor=pointer]:
                      - /url: /research/20060050783
                - link "Open Flame Spread Along Free Edges of Thermally Thin Samples in Microgravity on NASA NTRS" [ref=e554] [cursor=pointer]:
                  - /url: https://ntrs.nasa.gov/citations/20060050783
              - article [ref=e558]:
                - generic [aria-hidden] [ref=e559]: "07"
                - generic [ref=e560]:
                  - generic [ref=e561]:
                    - heading [level=4] [ref=e562]:
                      - link "Flame spread across liquids" [ref=e563] [cursor=pointer]:
                        - /url: /research/19960008391
                    - generic [ref=e564]: Conference Paper
                  - paragraph [ref=e565]: "Recent reviews of our understanding of flame spread across liquids show that there are many unresolved issues regarding the phenomenology and causal mechanisms affecting ignition susceptibility, flame spread characteristics, and flame spread rates. One area of discrepancy is the effect of buoyancy in both the uniform and pulsating spread regimes. The approach we have taken to resolving the importance of buoyancy for these flames is: (1) normal gravity (1g) and microgravity (micro g) experiments; and (2) numerical modeling at different gravitational levels. Of special interest to this work, as discussed at the previous workshop, is the determination of whether, and under what conditions, pulsating spread occurs in micro g. Microgravity offers a unique ability to modify and control the gas-phase flow pattern by utilizing a forced air flow over the pool surface."
                  - generic [ref=e566]:
                    - generic [ref=e567]: Ross, Howard D.; Miller, Fletcher; Schiller, David; Sirignano, William
                    - generic [ref=e568]: 1995-08-01
                    - generic [ref=e569]: Legacy CDMS
                  - generic [ref=e570]:
                    - generic [ref=e571]: NASA NTRS ID 19960008391
                    - link "View record details" [ref=e572] [cursor=pointer]:
                      - /url: /research/19960008391
                - link "Open Flame spread across liquids on NASA NTRS" [ref=e575] [cursor=pointer]:
                  - /url: https://ntrs.nasa.gov/citations/19960008391
              - article [ref=e579]:
                - generic [aria-hidden] [ref=e580]: "08"
                - generic [ref=e581]:
                  - generic [ref=e582]:
                    - heading [level=4] [ref=e583]:
                      - link "Opposed-Flow Flame Spread in a Narrow Channel Apparatus over Thin PMMA Sheets" [ref=e584] [cursor=pointer]:
                        - /url: /research/20140004923
                    - generic [ref=e585]: Conference Paper
                  - paragraph [ref=e586]: Flame spread tests have been conducted over polymethylmethacrylate (PMMA) samples in San Diego State University's Narrow Channel Apparatus (SDSU NCA). The Narrow Channel Apparatus (NCA) has the ability to suppress buoyant flow in horizontally spreading flames, and is currently being investigated as a possible replacement or complement to NASA's current material flammability test standard for non-metallic solids, NASA-STD-(I)-6001B Test 1. The buoyant suppression achieved with a NCA allows for tests to be conducted in a simulated microgravity atmosphere-a characteristic that Test 1 lacks since flames present in Test 1 are buoyantly driven. The SDSU NCA allows for flame spread tests to be conducted with varying opposed flow oxidizer velocities, oxygen percent by volume, and total pressure. Also, since the test sample is placed symmetrically between two confining plates so that there is a gap above and below the sample, this gap can be adjusted. This gap height adjustment allows for a compromise between heat loss from the flame to the confining boundaries and buoyancy suppression achieved by those boundaries. This article explores the effect gap height has on the flame spread rate for 75 μm thick PMMA at 1 atm pressure and 21% oxygen concentration by volume in the SDSU NCA. Flame spread results from the SDSU NCA for thin cellulose fuels have previously been compared to results from tests in actual microgravity at various test conditions with the same sample materials and were found to be in good agreement. This article also presents results from the SDSU NCA for PMMA at 1 atm pressure, opposed oxidizer velocity ranging from 3 to 35 cm/s, oxygen concentration by volume at 21%, 30 %, and 50% and fuel thicknesses of 50 and 75 μm. These results are compared to results obtained in actual microgravity for PMMA obtained at the 4.5s drop tower of MGLAB in Gifu, Japan, and the 5.2s drop tower at NASA's Zero-Gravity Research Facility in Cleveland, OH. This comparison confirms that at 1 atm pressure, the SDSU NCA successfully simulates microgravity for not only thin cellulose fuels, but also for thin PMMA sheets as well. This further supports the idea that the NCA is a viable option to complement or replace NASA's Test 1 for material flammability testing. Tests with thick fuels will be conducted in the future to further characterize the SDSU NCA.
                  - generic [ref=e587]:
                    - generic [ref=e588]: Bornand, G. R.; Olson, Sandra L.; Miller, F. J.; Pepper, J. M.; Wichman, I. S.
                    - generic [ref=e589]: 2013-05-19
                    - generic [ref=e590]: Glenn Research Center
                  - generic [ref=e591]:
                    - generic [ref=e592]: NASA NTRS ID 20140004923
                    - link "View record details" [ref=e593] [cursor=pointer]:
                      - /url: /research/20140004923
                - link "Open Opposed-Flow Flame Spread in a Narrow Channel Apparatus over Thin PMMA Sheets on NASA NTRS" [ref=e596] [cursor=pointer]:
                  - /url: https://ntrs.nasa.gov/citations/20140004923
              - article [ref=e600]:
                - generic [aria-hidden] [ref=e601]: "09"
                - generic [ref=e602]:
                  - generic [ref=e603]:
                    - heading [level=4] [ref=e604]:
                      - link "Concurrent Flame Growth, Spread and Extinction over Composite Fabric Samples in Low Speed Purely Forced Flow in Microgravity" [ref=e605] [cursor=pointer]:
                        - /url: /research/20150008962
                    - generic [ref=e606]: Conference Paper
                  - paragraph [ref=e607]: As a part of the NASA BASS and BASS-II experimental projects aboard the International Space Station, flame growth, spread and extinction over a composite cotton-fiberglass fabric blend (referred to as the SIBAL fabric) were studied in low-speed concurrent forced flows. The tests were conducted in a small flow duct within the Microgravity Science Glovebox. The fuel samples measured 1.2 and 2.2 cm wide and 10 cm long. Ambient oxygen was varied from 21% down to 16% and flow speed from 40 cm/s down to 1 cm/s. A small flame resulted at low flow, enabling us to observe the entire history of flame development including ignition, flame growth, steady spread (in some cases) and decay at the end of the sample. In addition, by decreasing flow velocity during some of the tests, low-speed flame quenching extinction limits were found as a function of oxygen percentage. The quenching speeds were found to be between 1 and 5 cm/s with higher speed in lower oxygen atmosphere. The shape of the quenching boundary supports the prediction by earlier theoretical models. These long duration microgravity experiments provide a rare opportunity for solid fuel combustion since microgravity time in ground-based facilities is generally not sufficient. This is the first time that a low-speed quenching boundary in concurrent spread is determined in a clean and unambiguous manner.
                  - generic [ref=e608]:
                    - generic [ref=e609]: Zhao, Xiaoyang; T'ien, James S.; Ferkul, Paul V.; Olson, Sandra L.
                    - generic [ref=e610]: 2015-05-17
                    - generic [ref=e611]: Glenn Research Center
                  - generic [ref=e612]:
                    - generic [ref=e613]: NASA NTRS ID 20150008962
                    - link "View record details" [ref=e614] [cursor=pointer]:
                      - /url: /research/20150008962
                - link "Open Concurrent Flame Growth, Spread and Extinction over Composite Fabric Samples in Low Speed Purely Forced Flow in Microgravity on NASA NTRS" [ref=e617] [cursor=pointer]:
                  - /url: https://ntrs.nasa.gov/citations/20150008962
              - article [ref=e621]:
                - generic [aria-hidden] [ref=e622]: "10"
                - generic [ref=e623]:
                  - generic [ref=e624]:
                    - heading [level=4] [ref=e625]:
                      - 'link "Flame Spread Across Liquids: Experimental Results" [ref=e626] [cursor=pointer]':
                        - /url: /research/19990054039
                    - generic [ref=e627]: Conference Paper
                  - paragraph [ref=e628]: The goal of our research on flame spread across a pool of liquid fuel is the quantitative identification of the mechanisms that control the rate and nature of flame spread when the initial temperature of the liquid pool is below the fuel's flash point temperature. Besides numerous experiments in drop towers and 1 g laboratories, we have flown five microgravity (mu-g) experiments on sounding rockets. As described in earlier papers, the first three flights examined the effect of forced opposed airflow over a 2.5 cm deep x 2 cm wide x 30 cm long pool of 1-butanol in mu-g. It was found that the flame spread is much slower and steadier than in 1 g where flame spread has a pulsating character. It was speculated that the flame spread in mu-g resembled the character of pseudo-uniform spread in 1 g; Ito et al later confirmed this conclusively in 1 g experiments. Much of the mu-g flame is also farther from the surface, dimmer, and with less soot, when compared to the 1 g flame. Three-dimensional liquid-phase flow patterns that control the liquid preheating were discovered in both 1 g and mu-g. Our numerical model, restricted to two dimensions, had predicted faster, pulsating flame spread in mu-g for opposed airflow. In examining the differences in the dimensionality of the model and experiment, it was noted that the experiment allowed gas expansion in the lateral direction (across the width of the pool), for which the model could not account. Such lateral expansion could reduce the expansion in the forward and upward directions. Because only these latter directions could be modeled, it was decided to artificially reduce the gas thermal expansion in the predictions. When this was done, satisfactory agreement could be obtained between the predicted and observed spread rates and the steadiness of the spread in microgravity. In 1 g, however, the predicted flame spread character also changed to pseudo-uniform, which disagreed with our 1 g experiments where the spread is pulsating. It was then speculated that gas-phase buoyant flow might oppose the lateral gas expansion, so that the 1 g experiments retained their pulsating flame spread character. If this speculation was valid, a difference in lateral gas expansion should be observable when comparing 1 g and mu-g experiments. Specifically, it was anticipated that greater flow divergence caused by lateral expansion would be measured in mu-g in the absence of a buoyant flow directed towards the flame.
