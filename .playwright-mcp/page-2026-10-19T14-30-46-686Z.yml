              - article [ref=e495]:
                - generic [aria-hidden] [ref=e496]: "04"
                - generic [ref=e497]:
                  - generic [ref=e498]:
                    - heading [level=4] [ref=e499]:
                      - link "Effect of Longitudinal Oscillations on Downward Flame Spread over Thin Solid Fuels" [ref=e500] [cursor=pointer]:
                        - /url: /research/20140004929
                    - generic [ref=e501]: Conference Paper
                  - paragraph [ref=e502]: Downward flame spread rates over vertically vibrated thin fuel samples are measured in air at one atmospheric pressure under normal gravity. Unlike flame spread against forced‐convective flows, the present results show that with increasing vibration acceleration the flame spread rate increases before being blown off at high acceleration levels causing flame extinction. A simple scaling analysis seems to explain this phenomenon, which may have important implications to flammability studies including in microgravity environments.
                  - generic [ref=e503]:
                    - generic [ref=e504]: Nayagam, Vedha; Sacksteder, Kurt
                    - generic [ref=e505]: 2013-05-19
