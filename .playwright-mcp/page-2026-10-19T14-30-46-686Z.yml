              - article [ref=e433]:
                - generic [aria-hidden] [ref=e434]: "01"
                - generic [ref=e435]:
                  - generic [ref=e436]:
                    - heading [level=4] [ref=e437]:
                      - link "Buoyancy Effects on Concurrent Flame Spread Over Thick PMMA" [ref=e438] [cursor=pointer]:
                        - /url: /research/20200000557
                    - generic [ref=e439]: Accepted Manuscript (Version with final changes)
                  - paragraph [ref=e440]: The flammability of combustible materials in a spacecraft is important for fire safety applications because the conditions in spacecraft environments differ from those on earth. Experimental testing in space is difficult and expensive. However, reducing buoyancy by decreasing ambient pressure is a possible approach to simulate on-earth the burning behavior inside spacecraft environments. The objective of this work is to determine that possibility by studying the effect of pressure on concurrent flame spread, and by comparison with microgravity data, observe up to what point low-pressure can be used to replicate flame spread characteristics observed in microgravity. Specifically, this work studies the effect of pressure and microgravity on upward/concurrent flame spread over 10 mm thick polymethyl methacrylate (PMMA) slabs. Experiments in normal gravity were conducted over pressures ranging between 100 and 40 kPa and a forced flow velocity of 200 mm/s. Microgravity experiments were conducted during NASA’s Spacecraft Fire Experiment (Saffire II), on board the Cygnus spacecraft at 100 kPa with an air flow velocity of 200 mm/s. Results show that reductions of pressure slow down the flame spread over the PMMA surface approaching that in microgravity. The data is correlated in terms of a non-dimensional mixed convection analysis that describes the convective heat transferred from the flame to the solid, and the primary mechanism controlling the spread of the flame. The extrapolation of the correlation to low pressures predicts well the flame spread rate obtained in microgravity in the Saffire II experiments. Similar results were obtained by the authors with similar experiments with a thin composite cotton/fiberglass fabric (published elsewhere). Both results suggest that reduced pressure can be used to approximately replicate flame behavior of untested gravity conditions for the burning of thick and thin solids. This work could provide guidance for potential ground-based testing for fire safety design in spacecraft and space habitats.
                  - generic [ref=e441]:
                    - generic [ref=e442]: Maria Thomsen; Carlos Fernandez-Pello; Gary A. Ruff; David L. Urban
                    - generic [ref=e443]: 2018-11-05
                    - generic [ref=e444]: Glenn Research Center
                  - generic [ref=e445]:
                    - generic [ref=e446]: NASA NTRS ID 20200000557
                    - link "View record details" [ref=e447] [cursor=pointer]:
                      - /url: /research/20200000557
                - link "Open Buoyancy Effects on Concurrent Flame Spread Over Thick PMMA on NASA NTRS" [ref=e450] [cursor=pointer]:
                  - /url: https://ntrs.nasa.gov/citations/20200000557
              - article [ref=e454]:
                - generic [aria-hidden] [ref=e455]: "02"
                - generic [ref=e456]:
                  - generic [ref=e457]:
                    - heading [level=4] [ref=e458]:
                      - link "Effects of Confinement on Flame Spread in Microgravity" [ref=e459] [cursor=pointer]:
                        - /url: /research/20205004657
                    - generic [ref=e460]: Conference Paper
                  - paragraph [ref=e461]: Solid fuel combustion experiments aboard the ISS examine the effects of confinement on a concurrent, purely-forced-flow flame spread in microgravity environment. The results for a thin, cotton-fiberglass-blended textile fabric fuel are presented. Flat baffles of differing materials are used to alter the radiative boundary conditions with transparent polycarbonate, black anodized aluminum (reflectance ~ 0), and highly polished aluminum (reflectance ~ 1). The baffles are parallel to the fuel sheet and placed symmetrically on each side. The inter-baffle distance is varied to change the boundary conditions for the flow. In all tests, samples are ignited at the upstream leading edge and allowed to burn to completion. Results show that the flame reaches a steady length and spread rate at low flow speeds (< 15 cm/s) for all tested inter-baffle distances. As the distance decreases, the flame length and spread rate first increase then decrease showing an optimal inter-baffle distance. For all baffle types, the flame either fails to ignite or extinguishes before reaching the end of the sample when the inter-baffle distance is too small (~ 1 cm). This is attributed to the reduction of oxygen supply to the flame zone and heat loss to the baffles. The results also show at the same inter-baffle distance, flame length and spread rate are highest for polished aluminum baffles, and lowest for transparent polycarbonate baffles. The differences are most prominent at intermediate tested baffle distances. While the radiative heat feedback from the baffles is expected to increase when the baffle distance decreases, the combustion is limited by the reduced oxygen supply. Near this limit, flame lengths and spread rates are similar for all baffle types.
                  - generic [ref=e462]:
                    - generic [ref=e463]: Yanjun Li; Ya-Ting T Liao; Paul V Ferkul; Michael C Johnston; Charles Bunnell
                    - generic [ref=e464]: Glenn Research Center
                  - generic [ref=e465]:
                    - generic [ref=e466]: NASA NTRS ID 20205004657
                    - link "View record details" [ref=e467] [cursor=pointer]:
                      - /url: /research/20205004657
                - link "Open Effects of Confinement on Flame Spread in Microgravity on NASA NTRS" [ref=e470] [cursor=pointer]:
