        - region [ref=f2e123]:
          - heading "Abstract" [level=2] [ref=f2e126]
          - paragraph [ref=f2e127]: Ignition of solid fuels by external thermal radiation and subsequent transition to flame spread are processes that not only are of considerable scientific interest but which also have fire safety applications. A material which undergoes a momentary ignition might be tolerable but a material which permits a transition to subsequent flame spread would significantly increase the fire hazard in a spacecraft. Therefore, the limiting condition under which flame cannot spread should be calculated from a model of the transition from ignition instead of by the traditional approach based on limits to a steady flame spread model. However, although the fundamental processes involved in ignition have been suggested there have been no definitive experimental or modeling studies due to the flow motion generated by buoyancy near the heated sample surface. In this study, microgravity experiments which required longer test times such as in air and surface smoldering experiment were conducted in the space shuttle STS-75 flight; shorter experimental tests such as in 35% and 50% oxygen were conducted in the droptower in the Japan Microgravity Center, JAMIC. Their experimental data along with theoretically calculated results from solving numerically the time-dependent Navier-Stokes equations are summarized in this paper.
