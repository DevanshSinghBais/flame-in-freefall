                      - /url: /sign-in?next=%2Fresearch%2F19990053973
                - 'link "Open Flow Effects on the Flammability Diagrams of Solid Fuels: Microgravity Influence on Ignition Delay on NASA NTRS" [ref=f1e736] [cursor=pointer]':
