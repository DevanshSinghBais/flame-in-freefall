              - article [ref=f1e740]:
                - generic [aria-hidden] [ref=f1e741]: "07"
                - generic [ref=f1e742]:
                  - generic [ref=f1e743]:
                    - heading [level=4] [ref=f1e744]:
                      - link "Multidimensional Effects on Ignition, Transition, and Flame Spread in Microgravity" [ref=f1e745] [cursor=pointer]:
                        - /url: /research/20010074014
                    - generic [ref=f1e746]: Conference Paper
                  - paragraph [ref=f1e747]: Localized ignition is initiated by an external radiant source at the middle of a thermally thin sample under external slow flow, simulating fire initiation in a spacecraft with a slow ventilation flow. Two ignition configurations are simulated, one across the sample surface creating a line shaped flame front (two-dimensional, 2-D, configuration) and the other a small circular ignition (three-dimensional, 3-D, configuration). Ignition, subsequent transition to simultaneously upstream and downstream flame spread, and flame growth behavior are studied experimentally and theoretically. Details of our theoretical models and numerical techniques can be found in previous publications. The effects of the sample width on the transition and subsequent flame spread, and flame spread along open edges of a thermally thin paper sample are determined. Experimental observations of flame spread phenomena were conducted in the 10 s drop tower and also on the space shuttle STS-75 flight to determine the effects of oxygen concentration and external flow velocity on flame spread rate and flame growth pattern. Finally, effects of confinement in a small test chamber on the transition and subsequent flame spread are examined. The results of these studies are briefly reported.
                  - generic [ref=f1e748]:
                    - generic [ref=f1e749]: 2001-05-01
                    - generic [ref=f1e750]: Glenn Research Center
                    - generic [ref=f1e751]: Kashiwagi, T.; Mell, W. E.; Nakamura, Y.; Olson, S. L.; Baum, H. R.; McGrattan, K. B.
                  - generic [ref=f1e752]:
                    - generic [ref=f1e753]: NASA NTRS ID 20010074014
                    - link "View record details" [ref=f1e754] [cursor=pointer]:
                      - /url: /research/20010074014
                    - link "Sign in to save" [ref=f1e757] [cursor=pointer]:
                      - /url: /sign-in?next=%2Fresearch%2F20010074014
                - link "Open Multidimensional Effects on Ignition, Transition, and Flame Spread in Microgravity on NASA NTRS" [ref=f1e760] [cursor=pointer]:
                  - /url: https://ntrs.nasa.gov/citations/20010074014
              - article [ref=f1e764]:
                - generic [aria-hidden] [ref=f1e765]: "08"
                - generic [ref=f1e766]:
                  - generic [ref=f1e767]:
                    - heading [level=4] [ref=f1e768]:
                      - link "Ignition, Transition, Flame Spread in Multidimensional Configurations in Microgravity" [ref=f1e769] [cursor=pointer]:
                        - /url: /research/19990054042
                    - generic [ref=f1e770]: Conference Paper
                  - paragraph [ref=f1e771]: In the inhabited quarters of orbiting spacecraft, fire is a greatly feared hazard. Thus, the fire safety strategy in a spacecraft is (1) to keep any fire as small as possible, (2) to detect any fire as early as possible, and (3) to extinguish any fire as quickly as possible. This suggests that a material which undergoes a momentary ignition might be tolerable but a material which permits a transition from a localized ignition to flame spread would significantly increase the fire hazard in a spacecraft. If the transition does not take place, fire growth does not occur. Therefore, it is critical to understand what process controls the transition. Many previous works have studied ignition and flame spread separately or were limited to a two-dimensional configuration. In this study, time-dependent phenomena of the transition over a thermally thin sample is studied experimentally and theoretically in two- and three-dimensional (2D,3D) configurations. Furthermore, localized ignition can be initiated at the center portion of thermally thin paper sample instead of at one end of the sample. Thus, the transition to flame spread could occur either toward upstream or downstream or both directions simultaneously with an external flow. In this presentation, the difference in the transition between the 3D and 2D configurations is explained with the numerically calculated data. For sufficiently narrow samples edge effects exist. Some results on this issue are presented. New analysis of the surface smoldering experiments conducted in the space shuttle STS-75 flight is also described.
