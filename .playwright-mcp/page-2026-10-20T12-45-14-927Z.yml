                - generic [ref=f1e598]:
                  - generic [ref=f1e599]:
                    - heading [level=4] [ref=f1e600]:
                      - link "Microgravity ignition experiment" [ref=f1e601] [cursor=pointer]:
                        - /url: /research/19940021214
                    - generic [ref=f1e602]: Conference Paper
                  - paragraph [ref=f1e603]: The purpose of this project is to develop a flight-ready apparatus of the microgravity ignition experiment for the GASCAN 2 program. The microgravity ignition experiment is designed to study how a microgravity environment affects the time to ignition of a sample of alpha-cellulose paper. A microgravity environment will result in a decrease in the heat transferred from the sample due to a lack of convection currents, which would decrease time to ignition. A lack of convection current would also cause the oxygen supply at the sample not to be renewed, which could delay or even prevent ignition. When this experiment is conducted aboard GASCAN 2, the dominant result of the lack of ignition will be determined. The experiment consists of four canisters containing four thermocouples and a sensor to detect ignition of the paper sample. This year the interior of the canister was redesigned and a mathematical model of the heat transfer around the sample was developed. This heat transfer model predicts an ignition time of approximately 5.5 seconds if the decrease of heat loss from the sample is the dominant factor of the lack of convection currents.
                  - generic [ref=f1e604]:
