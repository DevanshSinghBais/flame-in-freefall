              - article [ref=f1e620]:
                - generic [aria-hidden] [ref=f1e621]: "02"
                - generic [ref=f1e622]:
                  - generic [ref=f1e623]:
                    - heading [level=4] [ref=f1e624]:
                      - link "Microgravity ignition experiment" [ref=f1e625] [cursor=pointer]:
                        - /url: /research/19930008864
                    - generic [ref=f1e626]: Contractor Report (CR)
                  - paragraph [ref=f1e627]: The purpose of this project is to develop a flight ready apparatus of the microgravity ignition experiment for the GASCan 2 program. This involved redesigning, testing, and making final modifications to the existing apparatus. The microgravity ignition experiment is intended to test the effect of microgravity on the time to ignition of a sample of alpha-cellulose paper. An infrared heat lamp is used to heat the paper sample within a sealed canister. The interior of the canister was redesigned to increase stability and minimize conductive heat transfer to the sample. This design was fabricated and tested and a heat transfer model of the paper sample was developed.
