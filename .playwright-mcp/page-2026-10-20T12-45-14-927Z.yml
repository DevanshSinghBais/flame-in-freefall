              - article [ref=f1e692]:
                - generic [aria-hidden] [ref=f1e693]: "05"
                - generic [ref=f1e694]:
                  - generic [ref=f1e695]:
                    - heading [level=4] [ref=f1e696]:
                      - link "Theoretical Prediction of Microgravity Ignition Delay of Polymeric Fuels in Low Velocity Flows" [ref=f1e697] [cursor=pointer]:
                        - /url: /research/20010074015
                    - generic [ref=f1e698]: Conference Paper
                  - paragraph [ref=f1e699]: A new flammability apparatus and protocol, FIST (Forced Flow Ignition and Flame Spread Test), is under development. Based on the LIFT (Lateral Ignition and Flame Spread Test) protocol, FIST better reflects the environments expected in spacebased facilities. The final objective of the FIST research is to provide NASA with a test methodology that complements the existing protocol and provides a more comprehensive assessment of material flammability of practical materials for space applications. Theoretical modeling, an extensive normal gravity data bank and a few validation space experiments will support the testing methodology. The objective of the work presented here is to predict the ignition delay and critical heat flux for ignition of solid fuels in microgravity at airflow velocities below those induced in normal gravity. This is achieved through the application of a numerical model previously developed of piloted ignition of solid polymeric materials exposed to an external radiant heat flux. The model predictions will provide quantitative results about ignition of practical materials in the limiting conditions expected in space facilities. Experimental data of surface temperature histories and ignition delay obtained in the KC-135 aircraft are used to determine the critical pyrolysate mass flux for ignition and this value is subsequently used to predict the ignition delay and the critical heat flux for ignition of the material. Surface temperature and piloted ignition delay calculations for Polymethylmethacrylate (PMMA) and a Polypropylene/Fiberglass (PP/GL) composite were conducted under both reduced and normal gravity conditions. It was found that ignition delay times are significantly shorter at velocities below those induced by natural convection.
                  - generic [ref=f1e700]:
                    - generic [ref=f1e701]: 2001-05-01
                    - generic [ref=f1e702]: Glenn Research Center
                    - generic [ref=f1e703]: Fernandez-Pello, A. C.; Torero, J. L.; Zhou, Y. Y.; Walther, D.; Ross, H. D.
                  - generic [ref=f1e704]:
                    - generic [ref=f1e705]: NASA NTRS ID 20010074015
                    - link "View record details" [ref=f1e706] [cursor=pointer]:
                      - /url: /research/20010074015
                    - link "Sign in to save" [ref=f1e709] [cursor=pointer]:
                      - /url: /sign-in?next=%2Fresearch%2F20010074015
                - link "Open Theoretical Prediction of Microgravity Ignition Delay of Polymeric Fuels in Low Velocity Flows on NASA NTRS" [ref=f1e712] [cursor=pointer]:
                  - /url: https://ntrs.nasa.gov/citations/20010074015
              - article [ref=f1e716]:
                - generic [aria-hidden] [ref=f1e717]: "06"
                - generic [ref=f1e718]:
                  - generic [ref=f1e719]:
                    - heading [level=4] [ref=f1e720]:
                      - 'link "Flow Effects on the Flammability Diagrams of Solid Fuels: Microgravity Influence on Ignition Delay" [ref=f1e721] [cursor=pointer]':
                        - /url: /research/19990053973
                    - generic [ref=f1e722]: Conference Paper
                  - paragraph [ref=f1e723]: The possibility of an accidental fire in space-based facilities is a primary concern of space exploration programs. Spacecraft environments generally present low velocity air currents produced by ventilation and heating systems (of the order of 0.1 m/s), and fluctuating oxygen concentrations around that of air due to CO2 removal systems. Recent experiments of flame spread in microgravity show the spread rate to be faster and the limiting oxygen concentration lower than in normal-gravity. To date, there is not a material flammability-testing protocol that specifically addresses issues related to microgravity conditions. The present project (FIST) aims to establish a testing methodology that is suitable for the specific conditions of reduced gravity. The concepts underlying the operation of the LIFT apparatus, ASTM-E 1321-93, have been used to develop the Forced-flow Ignition and flame-Spread Test (FIST). As in the LIFT, the FIST is used to obtain the flammability diagrams of the material, i.e., graphs of ignition delay time and flame spread rate as a function of the externally applied radiant flux, but under forced flow rather than natural convection conditions, and for different oxygen concentrations. Although the flammability diagrams are similar, the flammability properties obtained with the FIST are found to depend on the flow characteristics. A research program is currently underway with the purpose of implementing the FIST as a protocol to characterize the flammability performance of solid materials to be used in microgravity facilities. To this point, tests have been performed with the FIST apparatus in both normal-gravity and microgravity conditions to determine the effects of oxidizer flow characteristics on the flammability diagrams of polymethylmethacrylate (PMMA) fuel samples. The experiments are conducted at reduced gravity in a KC- 135 aircraft following a parabolic flight trajectory that provides up to 25 seconds of low gravity. The objective of the experiments is to obtain data of ignition delay and flame spread rate at low flow velocities (0.1 to 0.2 m/s), which cannot be obtained under normal gravity because of the natural convection induced flows (approx. 0.5 m/s). Due to the limited reduced gravity time, the data can only be obtained for high radiant fluxes, and are consequently limited in scope. These tests do, however, provide insight into the flammability diagram characteristics at low velocity and reduced gravity, and also into the implications of the flow-dependence of the flammability properties under environments similar to those encountered in space facilities.
                  - generic [ref=f1e724]:
                    - generic [ref=f1e725]: 1999-05-01
                    - generic [ref=f1e726]: Glenn Research Center
                    - generic [ref=f1e727]: Cordova, J. L.; Walther, D. C.; Fernandez-Pello, A. C.; Steinhaus, T.; Torero, J. L.; Quintere, J. G.; Ross, H. D.
                  - generic [ref=f1e728]:
                    - generic [ref=f1e729]: NASA NTRS ID 19990053973
                    - link "View record details" [ref=f1e730] [cursor=pointer]:
