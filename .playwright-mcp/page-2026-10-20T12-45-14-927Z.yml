                      - link "Ultrasound Imaging System Implementation and Ignition Protocol for the Microgravity Smoldering Combustion (MSC) Experiments" [ref=f1e817] [cursor=pointer]:
                        - /url: /research/20000005011
                    - generic [ref=f1e818]: Conference Paper
                  - paragraph [ref=f1e819]: The Microgravity Smoldering Combustion (MSC) experiment is a study of the smolder characteristics of porous combustible materials in a microgravity environment. The objective of the study is to provide a better understanding of the controlling mechanisms of smolder, both in microgravity and normal earth gravity. Experiments have been conducted aboard the NASA Space Shuttle in the Get Away Special Canister (GAS-CAN), an apparatus requiring completely remote operation. Future GAS-CAN experiments will utilize an ultrasound imaging system (UIS) which has been incorporated into the MSC experimental apparatus. Thermocouples are currently used to measure temperature and reaction front velocities. A less intrusive method is desirable, however, as smolder is a very weak reaction and it has been found that heat transfer along the thermocouple is sufficient to affect the smolder reaction. It is expected that the UIS system will eventually replace the existing array of thermocouples as a non-intrusive technique without compromising data acquisition. The UIS measures line of sight permeability, providing information about the reaction front position and extent. Additionally, the ignition sequence of the MSC experiments has been optimized from previous experiments to provide longer periods of self-supported smolder. An ignition protocol of a fixed power to the igniter for a fixed time is now implemented. This, rather than a controlled temperature profile ignition protocol at the igniter surface, along with the UIS system, will allow for better study of the effect of gravity on a smolder reaction.
