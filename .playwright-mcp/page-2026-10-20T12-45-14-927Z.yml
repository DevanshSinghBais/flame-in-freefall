              - article [ref=f1e644]:
                - generic [aria-hidden] [ref=f1e645]: "03"
                - generic [ref=f1e646]:
                  - generic [ref=f1e647]:
                    - heading [level=4] [ref=f1e648]:
                      - link "Ignition, Transition, Flame Spread in Multidimensional Configurations in Microgravity" [ref=f1e649] [cursor=pointer]:
                        - /url: /research/19970020613
                    - generic [ref=f1e650]: Conference Paper
                  - paragraph [ref=f1e651]: Ignition of solid fuels by external thermal radiation and subsequent transition to flame spread are processes that not only are of considerable scientific interest but which also have fire safety applications. A material which undergoes a momentary ignition might be tolerable but a material which permits a transition to subsequent flame spread would significantly increase the fire hazard in a spacecraft. Therefore, the limiting condition under which flame cannot spread should be calculated from a model of the transition from ignition instead of by the traditional approach based on limits to a steady flame spread model. However, although the fundamental processes involved in ignition have been suggested there have been no definitive experimental or modeling studies due to the flow motion generated by buoyancy near the heated sample surface. In this study, microgravity experiments which required longer test times such as in air and surface smoldering experiment were conducted in the space shuttle STS-75 flight; shorter experimental tests such as in 35% and 50% oxygen were conducted in the droptower in the Japan Microgravity Center, JAMIC. Their experimental data along with theoretically calculated results from solving numerically the time-dependent Navier-Stokes equations are summarized in this paper.
                  - generic [ref=f1e652]:
                    - generic [ref=f1e653]: 1997-05-01
                    - generic [ref=f1e654]: Glenn Research Center
                    - generic [ref=f1e655]: Takashi Kashiwagi; William E Mell; Kevin B McGrattan; Howard R Baum; Sandra L Olson; Osamu Fujita; Masao Kikuchi; Kenichi Ito
                  - generic [ref=f1e656]:
                    - generic [ref=f1e657]: NASA NTRS ID 19970020613
                    - link "View record details" [ref=f1e658] [cursor=pointer]:
                      - /url: /research/19970020613
                    - link "Sign in to save" [ref=f1e661] [cursor=pointer]:
                      - /url: /sign-in?next=%2Fresearch%2F19970020613
                - link "Open Ignition, Transition, Flame Spread in Multidimensional Configurations in Microgravity on NASA NTRS" [ref=f1e664] [cursor=pointer]:
                  - /url: https://ntrs.nasa.gov/citations/19970020613
              - article [ref=f1e668]:
                - generic [aria-hidden] [ref=f1e669]: "04"
                - generic [ref=f1e670]:
                  - generic [ref=f1e671]:
                    - heading [level=4] [ref=f1e672]:
                      - link "Ignition and subsequent transition to flame spread in a microgravity environment" [ref=f1e673] [cursor=pointer]:
                        - /url: /research/19960008418
                    - generic [ref=f1e674]: Conference Paper
                  - paragraph [ref=f1e675]: The fire safety strategy in a spacecraft is (1) to detect any fire as early as possible, (2) to keep any fire as small as possible, and (3) to extinguish any fire as quickly as possible. This suggests that a material which undergoes a momentary, localized ignition might be tolerable but a material which permits a transition to flame spread would significantly increase the fire hazard. Therefore, it is important to understand how the transition from localized ignition to flame spread occurs and what parameters significantly affect the transition. The fundamental processes involved in ignition and flame spread have been extensively studied, but they have been studied separately. Some of the steady state flame models start from ignition to reach a steady state, but since the objective of such a calculation is to obtain the steady state flame spread rate, the calculation through the transition process is made without high accuracy to save computational time. We have studied the transition from a small localized ignition at the center of a thermally thin paper in a microgravity environment. The configuration for that study was axisymmetric, but more general versions of the numerical scheme have been developed by including the effects of a slow, external flow in both two and three dimensions. By exploiting the non-buoyant nature of the flow, it is possible to achieve resolution of fractions of millimeters for 3D flow domains on the order of 10 centimeters. Because the calculations are time dependent, we can study the evolution of multiple flame fronts originating from a localized ignition source. The interaction of these fronts determines whether or not they will eventually achieve steady state spread. Most flame spread studies in microgravity consider two-dimensional flame spread initiated by ignition at one end of a sample strip with or against a slow external flow. In this configuration there is only one flame front. A more realistic scenario involves separate, oppositely directed fronts in two dimensions, or a continuous, radially directed front in three dimensions. We present here some results of both the two and three dimensional codes.
                  - generic [ref=f1e676]:
                    - generic [ref=f1e677]: 1995-08-01
