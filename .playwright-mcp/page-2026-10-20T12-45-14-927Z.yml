                    - generic [ref=f1e794]: Conference Paper
                  - paragraph [ref=f1e795]: Localized ignition is initiated by an external radiant source at the middle of a thin solid sheet under external slow flow, simulating fire initiation in a spacecraft with a slow ventilation flow. Ignition behavior, subsequent transition simultaneously to upstream and downstream flame spread, and flame growth behavior are studied theoretically and experimentally. There are two transition stages in this study; one is the first transition from the onset of the ignition to form an initial anchored flame close to the sample surface, near the ignited area. The second transition is the flame growth stage from the anchored flame to a steady fire spread state (i.e. no change in flame size or in heat release rate) or a quasi-steady state, if either exists. Observations of experimental spot ignition characteristics and of the second transition over a thermally thin paper were made to determine the effects of external flow velocity. Both transitions have been studied theoretically to determine the effects of the confinement by a relatively small test chamber, of the ignition configuration (ignition across the sample width vs spot ignition), and of the external flow velocity on the two transitions over a thermally thin paper. This study is currently extending to two new areas; one is to include a thermoplastic sample such poly(methymethacrylate), PMMA, and the other is to determine the effects of sample thickness on the transitions. The recent results of these new studies on the first transition are briefly reported.
