        - paragraph [ref=f3e37]: On Earth, gravity-driven buoyant convection moves hot gases upward, shaping familiar flame forms. In microgravity, that upward flow is greatly reduced, changing the conditions in which flames develop.
        - paragraph [ref=f3e38]: Comparing these environments helps researchers investigate flame structure, soot, stability, and combustion behavior.
