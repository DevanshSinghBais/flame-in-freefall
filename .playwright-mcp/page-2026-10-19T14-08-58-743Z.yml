- generic [active] [ref=f1e1]: "{\"stats\":{\"took\":63,\"total\":8555,\"estimate\":false,\"maxScore\":121.1103},\"results\":[{\"_meta\":{\"score\":121.1103},\"copyright\":{\"thirdPartyPermissionsProduced\":false,\"disclosedToPublic\":false,\"containsIndication\":false,\"publisherPermissionOrRightsToDistribute\":false,\"belongsToUsGov\":false,\"determinationType\":\"PUBLIC_USE_PERMITTED\",\"thirdPartyContentCondition\":\"NOT_SET\",\"belongsToContractor\":false,\"disclosedInvention\":false,\"submissionId\":20170005789,\"containsThirdPartyMaterial\":false,\"belongsToPublisher\":false,\"id\":\"8263800fc47347088a086030989f8a19\",\"belongsToAuthors\":false},\"subjectCategories\":[\"Social And Information Sciences (General)\",\"Astrodynamics\"],\"keywords\":[\"forces\",\"microgravity\",\"motion\"],\"exportControl\":{\"isExportControl\":\"NO\",\"submissionId\":20170005789,\"ear\":\"NO\",\"id\":\"ccbe27b901924ffda4a59f8c8f7a9f45\",\"itar\":\"NO\"},\"distributionDate\":\"2019-07-12T00:00:00.0000000+00:00\",\"otherReportNumbers\":[\"GRC-E-DAA-TN13439\",\"Report Number: GRC-E-DAA-TN13439\"],\"fundingNumbers\":[{\"number\":\"WBS 277144.11.04.10.01\",\"submissionId\":20170005789,\"id\":\"174fc0672b0c47dd827ac8d5704a3271\",\"type\":\"WBS\"}],\"title\":\"How to Make a Microgravity Drop Tower for Your Classroom\",\"stiType\":\"PRESENTATION\",\"distribution\":\"PUBLIC\",\"submittedDate\":\"2017-06-27T12:00:22.3500000+00:00\",\"authorAffiliations\":[{\"sequence\":0,\"submissionId\":20170005789,\"meta\":{\"author\":{\"name\":\"DeLombard, Richard\"},\"organization\":{\"name\":\"Mr. Microgravity LTD\",\"location\":\"Huron, OH, United States\"}},\"id\":\"a9b4a2f25a1d430eb68fcc1fdac17788\"},{\"sequence\":1,\"submissionId\":20170005789,\"meta\":{\"author\":{\"name\":\"Hall, Nancy R.\"},\"organization\":{\"name\":\"NASA Glenn Research Center\",\"location\":\"Cleveland, OH United States\"}},\"id\":\"e6a736c1c3184302a2448c11f53a4ece\"}],\"stiTypeDetails\":\"Presentation\",\"technicalReviewType\":\"TECHNICAL_REVIEW_TYPE_NONE\",\"modified\":\"2025-08-31T18:39:21.7150190+00:00\",\"id\":20170005789,\"legacyMeta\":{\"__type\":\"LegacyMetaIndex, StrivesApi.ServiceModel\",\"accessionNumber\":\"\"},\"created\":\"2017-06-27T12:00:22.3500000+00:00\",\"center\":{\"code\":\"GRC\",\"name\":\"Glenn Research Center\",\"id\":\"19eeb25fa404421d9eaa5f876e853e3c\"},\"onlyAbstract\":false,\"sensitiveInformation\":2,\"abstract\":\"Microgravity is quite often seen as exotic and special as astronauts float around in the International Space Station, eating MM's in mid-air, and performing science experiments, all done seemingly without gravity being present. Surprisingly enough, up on the ISS there is about 90 of the same gravity that holds you to the floor in your classroom or museum exhibit hall. Participate in this session and you will understand that and more. You can use simple devices to demonstrate microgravity conditions in your classroom or museum exhibit hall. This will be the same microgravity condition that astronauts experience on the ISS, just for a much shorter period of time. Contrary to popular opinion of some people, microgravity is NOT caused by zero gravity up there. Microgravity on the ISS is due to free fall within the Earth's gravitational field. That means you can drop an item in free fall in your classroom and museum exhibit hall and that item will experience microgravity. In this session, a short theory segment will explain and reinforce these concepts so that you may explain to others. The session will concentrate on showing the session participants how to make an effective, but inexpensive, drop tower for use in the classroom. Such a drop tower may be used to reinforce classroom instruction in physics and forces motion as well as serve as a platform for student investigations, classroom competitions, and student science or technology fair entries. Session participants will build their own simple microgravity experiment and operate them in a drop tower, compare results, and modify their experiment based on results. This material is also useful for public demonstrations at school open houses, travelling museum exhibits, fixed museum exhibits, and independent student projects or experiments. These free fall concepts also connect terrestrial demonstrations with planetary moon motion, comet trajectory, and more.\",\"isLessonsLearned\":false,\"disseminated\":\"DOCUMENT_AND_METADATA\",\"meetings\":[{\"submissionId\":20170005789,\"name\":\"NASA Johnson Space Center\",\"location\":\"Houston, TX, United States\",\"id\":\"fb638b1eaa234a95baa4d88d0b6a56cd\"},{\"country\":\"United States\",\"submissionId\":20170005789,\"endDate\":\"2017-02-08T00:00:00.0000000+00:00\",\"sponsors\":[{\"meta\":{\"organization\":{\"name\":\"NASA Johnson Space Center\",\"location\":\"Houston, TX, United States\"}},\"meetingId\":\"7a16dc447e94489894acccbcf1b09d71\",\"id\":\"bf931de10bff42ffaa6dc8a175569e30\"}],\"name\":\"Space Exploration Educators Conference (SEEC) 2014\",\"location\":\"Houston, TX\",\"id\":\"7a16dc447e94489894acccbcf1b09d71\",\"startDate\":\"2017-02-06T00:00:00.0000000+00:00\"}],\"publications\":[{\"submissionId\":20170005789,\"id\":\"7aba7630d0dc49c7b734aea01819dd16\",\"publicationDate\":\"2014-02-06T00:00:00.0000000+00:00\"}],\"status\":\"CURATED\",\"related\":[],\"downloads\":[{\"draft\":false,\"mimetype\":\"application/pdf\",\"name\":\"20170005789.pdf\",\"type\":\"STI\",\"links\":{\"original\":\"/api/citations/20170005789/downloads/20170005789.pdf\",\"pdf\":\"/api/citations/20170005789/downloads/20170005789.pdf\",\"fulltext\":\"/api/citations/20170005789/downloads/20170005789.txt\"}}],\"downloadsAvailable\":true,\"index\":\"submissions-2026-10-15-05-24\"},{\"_meta\":{\"score\":107.0184},\"copyright\":{\"thirdPartyPermissionsProduced\":false,\"disclosedToPublic\":false,\"approverComments\":\"Items in TRS are protected by copyright, but are furnished with U.S. government purpose use rights.\",\"containsIndication\":true,\"pub