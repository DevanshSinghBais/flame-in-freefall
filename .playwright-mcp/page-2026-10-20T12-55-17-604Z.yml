                    - generic [ref=f1e1146]: Contractor or Grantee Report
                  - paragraph [ref=f1e1147]: "The Material Ignition and Suppression Test (MIST) project has had the objective of evaluating the ease of ignition and the fire suppression of materials used in spacecraft under environmental condition expected in a spacecraft. For this purpose, an experimental and theoretical research program is being conducted on the effect of space exploration atmospheres (SEA) on the piloted ignition of representative combustible materials, and on their fire suppression characteristics. The experimental apparatus and test methodology is derived from the Forced Ignition and Flame Spread Test (FIST), a well-developed bench scale test designed to extract material properties relevant to prediction of material flammability. In the FIST test, materials are exposed to an external radiant flux and the ignition delay and critical mass flux at ignition are determined as a function of the type of material and environmental conditions. In the original MIST design, a small-scale cylindrical flow duct with fuel samples attached to its inside wall was heated by a cylindrical heater located at the central axis of the cylinder. However, as the project evolved it was decided by NASA that it would be better to produce an experimental design that could accommodate other experiments with different experimental concepts. Based on those instructions and input from the requirements of other researchers that may share the hardware in an ISS/CIR experiment, a cylindrical design based on placing the sample at the center of an optically transparent tube with heaters equally spaced along the exterior of the cylinder was developed. Piloted ignition is attained by a hot wire igniter downstream of the fuel sample. Environment variables that can be studied via this experimental apparatus include: external radiant flux, oxidizer oxygen concentration, flow velocity, ambient pressure, and gravity level (if flown in the ISS/CIR). This constitutes the current experimental design, which maintains fairly good consistency with Dr Tien's and Dr Olson's project approaches. A further goal of the project has been to develop a combined solid/gas phase numerical model based on the MIST test methodology to predict the flammability behavior of practical materials in spacecraft."
