                    - generic [ref=f1e979]: Conference Proceedings
                  - paragraph [ref=f1e980]: This proceedings document is a compilation about work performed by a community of researchers from universities, industry and government laboratories across the United States and in Europe and Japan who have recognized the value of the reduced-gravity environment in attacking the fundamental and practical problems of combustion science. On their behalf, I am pleased to present this document to the assembled participants at the Fourth International Microgravity Combustion Workshop, to be held near the NASA Lewis Research Center in Cleveland, Ohio, on May 19-21, 1997.
