              - article [ref=f1e1021]:
                - generic [aria-hidden] [ref=f1e1022]: "15"
                - generic [ref=f1e1023]:
                  - generic [ref=f1e1024]:
                    - heading [level=4] [ref=f1e1025]:
                      - link "Candle Flames in Microgravity" [ref=f1e1026] [cursor=pointer]:
                        - /url: /research/19970020585
                    - generic [ref=f1e1027]: Conference Paper
                  - paragraph [ref=f1e1028]: This work is a study of a candle flame in a microgravity environment. The purpose of the work is to determine if a steady (or quasi-steady) flame can exist in a microgravity environment, study the characteristics of the steady flame, investigate the pre-extinction flame oscillations observed in a previous experiment in more detail, and finally, determine the nature of the interactions between two closely spaced candle flames. The candle flame is used as a model combustion system, in that in microgravity it is one of the only examples of a non-propagating, steady-state, pure diffusion flame. Others have used the candle to study a number of combustion phenomena including flame flicker, flame oscillations, electric field effects and enhanced and reduced gravitational effects in flames. The present work is a continuation of a small-scale Shuttle experiment on candle flames. That study showed that the candle flame lifetimes were on the order of 40 seconds, the flames were dim blue after a transient ignition period, and that just prior to extinction the flames oscillated spontaneously for about five seconds at a frequency of 1 Hz. The authors postulated that the gas phase in the immediate vicinity of the flame was quasi-steady. Further away from the flame, however, the assertion of a quasi-steady flame was less certain, thus the authors did not prove that a steady flame could exist. They also speculated that the short lifetime of the candle flame was due to the presence of the small, weakly perforated box that surrounded the candle. The Candle Flames in Microgravity (CFM) experiment, with revised hardware, was recently flown aboard the Mir orbiting station, and conducted inside the glovebox facility by Dr. Shannon Lucid. In addition to the purposes described above, the experiments were NASA's first ability to ascertain the merits of the Mir environment for combustion science studies. In this article, we present the results of that experiment. We are also in the process of developing a numerical model of the microgravity candle flame. The status and results of the modeling efforts to date are also presented.
                  - generic [ref=f1e1029]:
