                - generic [ref=f1e927]:
                  - generic [ref=f1e928]:
                    - heading [level=4] [ref=f1e929]:
                      - link "Combustion of Interacting Droplet Arrays in a Microgravity Environment" [ref=f1e930] [cursor=pointer]:
                        - /url: /research/20010074042
                    - generic [ref=f1e931]: Conference Paper
                  - paragraph [ref=f1e932]: Investigations into droplet interactions date back to Rex et al. Annamalai and Ryan and Annamalai published extensive reviews of droplet array and cloud combustion studies. In the majority of the reviewed studies, the authors examined the change in the burning rate constant, k, (relative to that of the single droplet) that results from interactions. More recently, Niioka and co-workers have examined ignition and flame propagation along arrays of interacting droplets with the goal of relating these phenomena in this simplified geometry to the more practical spray configuration. Our work has focussed on droplet interactions under conditions where flame extinction occurs at a finite droplet diameter. In our previous work, we reported that in normal gravity, reduced pressure conditions, droplet interactions improved flame stability and extended flammability limits (by inference). In our recent work, we examine droplet interactions under conditions where the flame extinguishes at a finite droplet diameter in microgravity. The microgravity experiments were in the NASA GRC 2.2 and 5.2 second drop towers, and the JAMIC (Japan Microgravity Center) 10 second drop tower. We also present progress on a numerical model of single droplet combustion that is in the process of being extended to model a binary droplet array.
                  - generic [ref=f1e933]:
