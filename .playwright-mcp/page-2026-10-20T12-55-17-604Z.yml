              - article [ref=f1e1117]:
                - generic [aria-hidden] [ref=f1e1118]: "19"
                - generic [ref=f1e1119]:
                  - generic [ref=f1e1120]:
                    - heading [level=4] [ref=f1e1121]:
                      - link "Radiative Ignition and the Transition to Flame Spread Investigated in the Japan Microgravity Center's 10-sec Drop Shaft" [ref=f1e1122] [cursor=pointer]:
                        - /url: /research/20050176400
                    - generic [ref=f1e1123]: Other
                  - paragraph [ref=f1e1124]: The Radiative Ignition and Transition to Spread Investigation (RITSI) is a shuttle middeck Glovebox combustion experiment developed by the NASA Lewis Research Center, the National Institute for Standards and Technology (NIST), and Aerospace Design and Fabrication (ADF). It is scheduled to fly on the third United States Microgravity Payload (USMP-3) mission in February 1996. The objective of RITSI is to experimentally study radiative ignition and the subsequent transition to flame spread in low gravity in the presence of very low speed air flows in two- and three-dimensional configurations. Toward this objective, a unique collaboration between NASA, NIST, and the University of Hokkaido was established to conduct 15 science and engineering tests in Japan's 10-sec drop shaft. For these tests, the RITSI engineering hardware was mounted in a sealed chamber with a variable oxygen atmosphere. Ashless filter paper was ignited during each drop by a tungsten-halogen heat lamp focused on a small spot in the center of the paper. The flame spread outward from that point. Data recorded included fan voltage (a measure of air flow), radiant heater voltage (a measure of radiative ignition energy), and surface temperatures (measured by up to three surface thermocouples) during ignition and flame spread.
