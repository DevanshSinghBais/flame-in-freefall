              - article [ref=f1e1069]:
                - generic [aria-hidden] [ref=f1e1070]: "17"
                - generic [ref=f1e1071]:
                  - generic [ref=f1e1072]:
                    - heading [level=4] [ref=f1e1073]:
                      - link "Microgravity smoldering combustion on the USML-1 Space Shuttle mission" [ref=f1e1074] [cursor=pointer]:
                        - /url: /research/19960008388
                    - generic [ref=f1e1075]: Conference Paper
                  - paragraph [ref=f1e1076]: Preliminary results from an experimental study of the smolder characteristics of a porous combustible material (flexible polyurethane foam) in normal and microgravity are presented. The experiments, limited in fuel sample size and power available for ignition, show that the smolder process was primarily controlled by heat losses from the reaction to the surrounding environment In microgravity, the reduced heat losses due to the absence of natural convection result in only slightly higher temperatures in the quiescent microgravity test than in normal gravity, but a dramatically larger production of combustion products in all microgravity tests. Particularly significant is the proportionately larger amount of carbon monoxide and light organic compounds produced in microgravity, despite comparable temperatures and similar char patterns. This excessive production of fuel-rich combustion products may be a generic characteristic of smoldering polyurethane in microgravity, with an associated increase in the toxic hazard of smolder in spacecraft.
                  - generic [ref=f1e1077]:
                    - generic [ref=f1e1078]: 1995-08-01
                    - generic [ref=f1e1079]: Legacy CDMS
