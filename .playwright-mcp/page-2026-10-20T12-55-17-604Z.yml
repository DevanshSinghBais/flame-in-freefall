                    - heading [level=4] [ref=f1e953]:
                      - link "Ignition and combustion of bulk metals in a microgravity environment" [ref=f1e954] [cursor=pointer]:
                        - /url: /research/19950011667
                    - generic [ref=f1e955]: Contractor Report (CR)
                  - paragraph [ref=f1e956]: Knowledge of the oxidation, ignition, and combustion of bulk metals is important for fire safety in the production, management, and utilization of liquid and gaseous oxygen for ground based and space applications. This report summarizes research under NASA support to investigate the ignition and combustion characteristics of bulk metals under varying gravity conditions. Metal ignition and combustion have not been studied previously under these conditions and the results are important not only for improved fire safety but also to increase knowledge of basic ignition and combustion mechanisms. The studies completed to date have led to the development of a clean and reproducible ignition source and diagnostic techniques for combustion measurements and have provided normal gravity combustion data on ten different pure metals. Metal specimens were ignited using a xenon short-arc lamp and measurements were made of the radiant energy flux, surface temperature history, spectroscopy of surface and gas products, and surface morphology and chemistry. Elevated gravity was provided by the University of Colorado Geotechnical Centrifuge.
