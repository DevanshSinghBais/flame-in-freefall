              - article [ref=f1e427]:
                - generic [aria-hidden] [ref=f1e428]: "11"
                - generic [ref=f1e429]:
                  - generic [ref=f1e430]:
                    - heading [level=4] [ref=f1e431]:
                      - link "Selected Diagnostics for Microgravity Combustion Science" [ref=f1e432] [cursor=pointer]:
                        - /url: /research/19970020591
                    - generic [ref=f1e433]: Conference Paper
                  - paragraph [ref=f1e434]: The evolution of our understanding of combustion phenomena occurring under reduced gravity conditions poses a continuing demand for diagnostic tools of increased sophistication. Existing methods have become insufficient to keep pace with emerging refinements in the underlying theories and predictive models. The coupling of physical mechanisms inherent in combustion systems mandates the simultaneous determination of numerous thermophysical quantities, principally temperature, velocity, and species concentrations. Observed differences attributable to variations in experimental configuration, fuels and diluents, and initial conditions enhance the difficulty of developing diagnostic methods suitable for the acquisition of the required data over the desired range of experimental parameters. Efforts to provide for ongoing diagnostic development supporting microgravity combustion science experiments are conducted within the Microgravity Science Division at the NASA-Lewis Research Center. The following describes recent results from several diagnostic development efforts conducted under this project.
                  - generic [ref=f1e435]:
                    - generic [ref=f1e436]: Paul S Greenberg; Karen J Weiland; DeVon W Griffin; William Yanis
                    - generic [ref=f1e437]: 1997-05-01
                    - generic [ref=f1e438]: Glenn Research Center
                  - generic [ref=f1e439]:
                    - generic [ref=f1e440]: NASA NTRS ID 19970020591
                    - link "View record details" [ref=f1e441] [cursor=pointer]:
                      - /url: /research/19970020591
                - link "Open Selected Diagnostics for Microgravity Combustion Science on NASA NTRS" [ref=f1e444] [cursor=pointer]:
                  - /url: https://ntrs.nasa.gov/citations/19970020591
              - article [ref=f1e448]:
                - generic [aria-hidden] [ref=f1e449]: "12"
                - generic [ref=f1e450]:
                  - generic [ref=f1e451]:
                    - heading [level=4] [ref=f1e452]:
                      - link "Numerical Modeling for Combustion of Thermoplastic Materials in Microgravity" [ref=f1e453] [cursor=pointer]:
                        - /url: /research/19970020587
                    - generic [ref=f1e454]: Conference Paper
                  - paragraph [ref=f1e455]: A time-dependent, three-dimensional model is under development to predict the temperature field, burning rate, and bubble bursting characteristics of burning thermoplastic materials in microgravity. Model results will be compared with experiments performed under microgravity and normal gravity conditions. The model will then be used to study the effects of variations in material properties and combustion conditions on burning rate and combustion behavior.
                  - generic [ref=f1e456]:
