              - article [ref=f4e402]:
                - generic [aria-hidden] [ref=f4e403]: "09"
                - generic [ref=f4e404]:
                  - generic [ref=f4e405]:
                    - heading [level=4] [ref=f4e406]:
                      - link "Advanced Combustion via Microgravity Experiments (ACME) on the International Space Station (ISS)" [ref=f4e407] [cursor=pointer]:
                        - /url: /research/20210015913
                    - generic [ref=f4e408]: Poster
                  - paragraph [ref=f4e409]: Experimental studies of laminar, non-premixed flames of gaseous fuels are underway on the International Space Station (ISS) as part of NASA’s Advanced Combustion via Microgravity Experiments(ACME) project. The research is primarily focused on improving practical terrestrial combustion through fundamental microgravity research, where a secondary objective is spacecraft fire safety. Example goals are to improve understanding of flame stability and extinction limits, soot control and reduction, oxygen-enriched combustion which could enable practical carbon sequestration, combustion at fuel lean conditions where both optimum performance and low emissions can be achieved, the use of electric fields for combustion control, cool flame chemical kinetics, and materials flammability. The microgravity environment avoids buoyancy-induced flicker and enables the creation of spherical flames, allowing numerical models to focus computational power on transport phenomena and chemical kinetics. Compared to normal gravity, microgravity also provides longer residence times and larger length scales, yielding a broad range of flame conditions which are beneficial for simplified analysis, e.g., of limit behavior where chemical kinetics are important. Using modular hardware, research for six independent investigations is being carried out within the station’s Combustion Integrated Rack (CIR). While the ISS crew members set up the experimental hardware, the tests are remotely commanded with investigator input from the NASA Glenn Research Center. Over a thousand flames have been ignited since ACME operations began in Sept. 2017 and selected results from the first five experiments are summarized.
