              - article [ref=f4e381]:
                - generic [aria-hidden] [ref=f4e382]: "08"
                - generic [ref=f4e383]:
                  - generic [ref=f4e384]:
                    - heading [level=4] [ref=f4e385]:
                      - link "Sixth International Microgravity Combustion Workshop" [ref=f4e386] [cursor=pointer]:
                        - /url: /research/20010073993
                    - generic [ref=f4e387]: Conference Proceedings
                  - paragraph [ref=f4e388]: This conference proceedings document is a compilation of papers presented orally or as poster displays to the Sixth International Microgravity Combustion Workshop held in Cleveland, Ohio on May 22-24, 2001. The purpose of the workshop is to present and exchange research results from theoretical and experimental work in combustion science using the reduced-gravity environment as a research tool. The results are contributed by researchers funded by NASA throughout the United States at universities, industry and government research agencies, and by researchers from international partner countries that are also participating in the microgravity combustion science research discipline. These research results are intended for use by public and private sector organizations for academic purposes, for the development of technologies needed for Human Exploration and Development of Space, and to improve Earth-bound combustion and fire-safety related technologies.
                  - generic [ref=f4e389]:
                    - generic [ref=f4e390]: Sacksteder, Kurt
                    - generic [ref=f4e391]: 2001-05-01
                    - generic [ref=f4e392]: Glenn Research Center
                  - generic [ref=f4e393]:
