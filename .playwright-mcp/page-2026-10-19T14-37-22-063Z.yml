                    - heading [level=4] [ref=f4e280]:
                      - link "Fifth International Microgravity Combustion Workshop" [ref=f4e281] [cursor=pointer]:
                        - /url: /research/19990053965
                    - generic [ref=f4e282]: Conference Publication (CP)
                  - paragraph [ref=f4e283]: On behalf of the NASA Headquarters Microgravity Research Division and the Microgravity Combustion Science Discipline Working Group, we are pleased to present these proceedings of the Fifth International Microgravity Combustion Workshop. At the time we go to press we expect to welcome to the workshop over 250 presenters and participants from U.S. academia, industry, and government; and from at least 8 international partner countries. We come together for this workshop at the beginning of the International Space Station era, where the future of microgravity combustion science programs will unfold over the next few years. As we accelerate our preparations for the ISS, this book and the growing literature base cited herein provide a summary of the accomplishments of approximately forty space-flight experiment-missions (plus nearly countless drop tests and aircraft parabolas) and a valuable resource for the new experiment ideas of the future.
                  - generic [ref=f4e284]:
