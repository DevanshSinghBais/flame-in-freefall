              - article [ref=f4e318]:
                - generic [aria-hidden] [ref=f4e319]: "05"
                - generic [ref=f4e320]:
                  - generic [ref=f4e321]:
                    - heading [level=4] [ref=f4e322]:
                      - link "Combustion of Interacting Droplet Arrays in a Microgravity Environment" [ref=f4e323] [cursor=pointer]:
                        - /url: /research/19990054030
                    - generic [ref=f4e324]: Conference Paper
                  - paragraph [ref=f4e325]: Investigations into droplet interactions date back to Rex et al. Recently, Annamalai and Ryan and Annamalai published extensive reviews of droplet array and cloud combustion studies. The authors studied the change in the burning rate constant, k, (relative to that of the single droplet) that results from interactions. Under certain conditions, there exists a separation distance where the droplet lifetime reaches a minimum, or average burning rate constant is a maximum . Additionally, since inter-droplet separation distance, L, increases relative to the droplet size, D, as the burning proceeds, the burning rate is not constant throughout the burn, but changes continuously with time. Only Law and co-workers and Mikami et al. studied interactions under conditions where buoyant forces were negligible. Comparing their results with existing theory, Law and co-workers found that theory over predicted the persistency and intensity of droplet interactions. The droplet interactions also depended on the initial array configuration as well as the instantaneous array configuration. They also concluded that droplet heating was retarded due to interactions and that the burning process did not follow the "D-squared" law. Mikami et al. studied the combustion of a two-droplet array of heptane burning in air at one atm pressure in microgravity. They showed that the instantaneous burning rate constant increases throughout the droplet lifetime, even for a single droplet. Also, the burn time of the array reached a minimum at a critical inter-droplet spacing. In this article, we examine droplet interactions in normal and microgravity environments. The microgravity experiments were in the NASA GRC 2.2 and 5.2 second drop towers, and the JAMIC (Japan Microgravity Center) 10 second drop tower. Special emphasis is directed to combustion under conditions that yield finite extinction diameters, and to determine how droplet interactions affect the extinction process.
                  - generic [ref=f4e326]:
                    - generic [ref=f4e327]: Dietrich, D. L.; Struk, P. M.; Kitano, K.; Ikegami, M.
                    - generic [ref=f4e328]: 1999-05-01
                    - generic [ref=f4e329]: Glenn Research Center
                  - generic [ref=f4e330]:
                    - generic [ref=f4e331]: NASA NTRS ID 19990054030
                    - link "View record details" [ref=f4e332] [cursor=pointer]:
