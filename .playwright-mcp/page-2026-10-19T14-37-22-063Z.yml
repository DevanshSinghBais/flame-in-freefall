                - link "Open Combustion of Interacting Droplet Arrays in a Microgravity Environment on NASA NTRS" [ref=f4e335] [cursor=pointer]:
                  - /url: https://ntrs.nasa.gov/citations/19990054030
              - article [ref=f4e339]:
                - generic [aria-hidden] [ref=f4e340]: "06"
                - generic [ref=f4e341]:
                  - generic [ref=f4e342]:
                    - heading [level=4] [ref=f4e343]:
                      - link "NASA Microgravity Combustion Science Program" [ref=f4e344] [cursor=pointer]:
                        - /url: /research/19990053966
                    - generic [ref=f4e345]: Conference Paper
                  - paragraph [ref=f4e346]: Combustion has been a subject of increasingly vigorous scientific research for over a century, not surprising considering that combustion accounts for approximately 85% of the world's energy production and is a key element of many critical technologies used by contemporary society. Although combustion technology is vital to our standard of living, it also poses great challenges to maintaining a habitable environment. A major goal of combustion research is production of fundamental (foundational) knowledge that can be used in developing accurate simulations of complex combustion processes, replacing current "cut-and-try" approaches and allowing developers to improve the efficiency of combustion devices, to reduce the production of harmful emissions, and to reduce the incidence of accidental uncontrolled combustion. With full understanding of the physics and chemistry involved in a given combustion process, including details of the unit processes and their interactions, physically accurate models which can then be used for parametric exploration of new combustion domains via computer simulation can be developed, with possible resultant definition of radically different approaches to accomplishment of various combustion goals. Effects of gravitational forces on earth impede combustion studies more than they impede most other areas of science. The effects of buoyancy are so ubiquitous that we often do not appreciate the enormous negative impact that they have had on the rational development of combustion science. Microgravity offers potential for major gains in combustion science understanding in that it offers unique capability to establish the flow environment rather than having it dominated by uncontrollable (under normal gravity) buoyancy effects and, through this control, to extend the range of test conditions that can be studied. It cannot be emphasized too strongly that our program is dedicated to taking advantage of microgravity to untangle complications caused by gravity, allowing major strides in our understanding of combustion processes and in subsequent development of improved combustion devices leading to improved quality of life on Earth. Fire and/or explosion events aboard spacecraft could be devastating to international efforts to expand the human presence in space. Testing to date has shown that ignition and flame spread on fuel surfaces (e.g., paper, wire insulation) behave quite differently under partial gravity and microgravity conditions. In addition, fire signatures-i.e., heat release, smoke production, flame visibility, and radiation-are now known to be quite different in reduced gravity environments; this research has provided data to improve the effectiveness of fire prevention practices, smoke and fire detectors, and fire extinguishment systems. The more we can apply our scientific and technological understanding to potential fire behavior in microgravity and partial gravity, the more assurance can be given to those people whose lives depend on the environment aboard spacecraft or eventually on habitats on the Moon or Mars.
                  - generic [ref=f4e347]:
                    - generic [ref=f4e348]: Merrill K King
                    - generic [ref=f4e349]: 1999-05-18
                    - generic [ref=f4e350]: Glenn Research Center
                  - generic [ref=f4e351]:
                    - generic [ref=f4e352]: NASA NTRS ID 19990053966
                    - link "View record details" [ref=f4e353] [cursor=pointer]:
                      - /url: /research/19990053966
                - link "Open NASA Microgravity Combustion Science Program on NASA NTRS" [ref=f4e356] [cursor=pointer]:
                  - /url: https://ntrs.nasa.gov/citations/19990053966
              - article [ref=f4e360]:
                - generic [aria-hidden] [ref=f4e361]: "07"
                - generic [ref=f4e362]:
                  - generic [ref=f4e363]:
                    - heading [level=4] [ref=f4e364]:
                      - link "NASA Microgravity Combustion Science Program" [ref=f4e365] [cursor=pointer]:
                        - /url: /research/19970020548
                    - generic [ref=f4e366]: Conference Paper
                  - paragraph [ref=f4e367]: Combustion is a key element of many critical technologies used by contemporary society. For example, electric power production, home heating, surface and air transportation, space propulsion, and materials synthesis all utilize combustion as a source of energy. Yet, although combustion technology is vital to our standard of living, it poses great challenges to maintaining a habitable environment. For example, pollutants, atmospheric change and global warming, unwanted fires and explosions, and the incineration of hazardous wastes are major problem areas which would benefit from improved understanding of combustion. Effects of gravitational forces impede combustion studies more than most other areas of science since combustion involves production of high-temperature gases whose low density results in buoyant motion, vastly complicating the execution and interpretation of experiments. Effects of buoyancy are so ubiquitous that their enormous negative impact on the rational development of combustion science is generally not recognized. Buoyant motion also triggers the onset of turbulence, yielding complicating unsteady effects. Finally, gravity forces cause particles and drops to settle, inhibiting deconvoluted studies of heterogeneous flames important to furnace, incineration and power generation technologies. Thus, effects of buoyancy have seriously limited our capabilities to carry out 'clean' experiments needed for fundamental understanding of flame phenomena. Combustion scientists can use microgravity to simplify the study of many combustion processes, allowing fresh insights into important problems via a deeper understanding of elemental phenomena also found in Earth-based combustion processes and to additionally provide valuable information concerning how fires behave in microgravity and how fire safety on spacecraft can be enhanced.
