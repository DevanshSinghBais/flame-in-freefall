              - article [ref=f4e297]:
                - generic [aria-hidden] [ref=f4e298]: "04"
                - generic [ref=f4e299]:
                  - generic [ref=f4e300]:
                    - heading [level=4] [ref=f4e301]:
                      - link "Smoldering Combustion Experiments in Microgravity" [ref=f4e302] [cursor=pointer]:
                        - /url: /research/19970020606
                    - generic [ref=f4e303]: Conference Paper
                  - paragraph [ref=f4e304]: The Microgravity Smoldering Combustion (MSC) experiment is part of a study of the smolder characteristics of porous combustible materials in a microgravity environment. Smoldering is a non-flaming form of combustion that takes place in the interior of porous materials and takes place in a number of processes ranging from smoldering of porous insulation materials to high temperature synthesis of metals. The objective of the study is to provide a better understanding of the controlling mechanisms of smolder, both in microgravity and normal-gravity. As with many forms of combustion, gravity affects the availability of oxidizer and transport of heat, and therefore the rate of combustion. Microgravity smolder experiments, in both a quiescent oxidizing environment, and in a forced oxidizing flow have been conducted aboard the NASA Space Shuttle (STS-69 and STS-77 missions) to determine the effect of the ambient oxygen concentration and oxidizer forced flow velocity on smolder combustion in microgravity. The experimental apparatus is contained within the NASA Get Away Special Canister (GAS-CAN) Payload. These two sets of experiments investigate the propagation of smolder along the polyurethane foam sample under both diffusion driven and forced flow driven smoldering. The results of the microgravity experiments are compared with identical ones carried out in normal gravity, and are used to verify present theories of smolder combustion. The results of this study will provide new insights into the smoldering combustion process. Thermocouple histories show that the microgravity smolder reaction temperatures (Ts) and propagation velocities (Us) lie between those of identical normal-gravity upward and downward tests. These observations indicate the effect of buoyancy on the transport of oxidizer to the reaction front.
                  - generic [ref=f4e305]:
                    - generic [ref=f4e306]: David C Walther; A Carlos Fernandez-Pello; David L Urban
                    - generic [ref=f4e307]: 1997-05-01
                    - generic [ref=f4e308]: Glenn Research Center
                  - generic [ref=f4e309]:
                    - generic [ref=f4e310]: NASA NTRS ID 19970020606
                    - link "View record details" [ref=f4e311] [cursor=pointer]:
