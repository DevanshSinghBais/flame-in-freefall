            - listitem [ref=f6e172]:
              - generic [ref=f6e173]:
                - paragraph [ref=f6e174]:
                  - generic [ref=f6e175]: NASA NTRS ID 19960008418
                  - generic [ref=f6e176]: Conference Paper
                - heading [level=3] [ref=f6e177]:
                  - link "Ignition and subsequent transition to flame spread in a microgravity environment" [ref=f6e178] [cursor=pointer]:
                    - /url: /research/19960008418
                - paragraph [ref=f6e179]: The fire safety strategy in a spacecraft is (1) to detect any fire as early as possible, (2) to keep any fire as small as possible, and (3) to extinguish any fire as quickly as possible. This suggests that a material which undergoes a momentary, localized ignition might be tolerable but a material which permits a transition to flame spread would significantly increase the fire hazard. Therefore, it is important to understand how the transition from localized ignition to flame spread occurs and what parameters significantly affect the transition. The fundamental processes involved in ignition and flame spread have been extensively studied, but they have been studied separately. Some of the steady state flame models start from ignition to reach a steady state, but since the objective of such a calculation is to obtain the steady state flame spread rate, the calculation through the transition process is made without high accuracy to save computational time. We have studied the transition from a small localized ignition at the center of a thermally thin paper in a microgravity environment. The configuration for that study was axisymmetric, but more general versions of the numerical scheme have been developed by including the effects of a slow, external flow in both two and three dimensions. By exploiting the non-buoyant nature of the flow, it is possible to achieve resolution of fractions of millimeters for 3D flow domains on the order of 10 centimeters. Because the calculations are time dependent, we can study the evolution of multiple flame fronts originating from a localized ignition source. The interaction of these fronts determines whether or not they will eventually achieve steady state spread. Most flame spread studies in microgravity consider two-dimensional flame spread initiated by ignition at one end of a sample strip with or against a slow external flow. In this configuration there is only one flame front. A more realistic scenario involves separate, oppositely directed fronts in two dimensions, or a continuous, radially directed front in three dimensions. We present here some results of both the two and three dimensional codes.
                - paragraph [ref=f6e180]: Kashiwagi, Takashi; Mcgrattan, Kevin; Baum, Howard
