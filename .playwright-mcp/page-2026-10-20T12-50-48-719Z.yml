                  - generic [ref=f6e157]: NASA NTRS ID 19970020613
                  - generic [ref=f6e158]: Conference Paper
                - heading [level=3] [ref=f6e159]:
                  - link "Ignition, Transition, Flame Spread in Multidimensional Configurations in Microgravity" [ref=f6e160] [cursor=pointer]:
                    - /url: /research/19970020613
                - paragraph [ref=f6e161]: Ignition of solid fuels by external thermal radiation and subsequent transition to flame spread are processes that not only are of considerable scientific interest but which also have fire safety applications. A material which undergoes a momentary ignition might be tolerable but a material which permits a transition to subsequent flame spread would significantly increase the fire hazard in a spacecraft. Therefore, the limiting condition under which flame cannot spread should be calculated from a model of the transition from ignition instead of by the traditional approach based on limits to a steady flame spread model. However, although the fundamental processes involved in ignition have been suggested there have been no definitive experimental or modeling studies due to the flow motion generated by buoyancy near the heated sample surface. In this study, microgravity experiments which required longer test times such as in air and surface smoldering experiment were conducted in the space shuttle STS-75 flight; shorter experimental tests such as in 35% and 50% oxygen were conducted in the droptower in the Japan Microgravity Center, JAMIC. Their experimental data along with theoretically calculated results from solving numerically the time-dependent Navier-Stokes equations are summarized in this paper.
                - paragraph [ref=f6e162]: Takashi Kashiwagi; William E Mell; Kevin B McGrattan; Howard R Baum; Sandra L Olson; Osamu Fujita; Masao Kikuchi; Kenichi Ito
                - generic [ref=f6e163]:
                  - generic [ref=f6e164]: NASA NTRS ID 19970020613
                  - generic [ref=f6e165]: Conference Paper
                  - generic [ref=f6e166]: 1997-05-01
                  - generic [ref=f6e167]: Glenn Research Center
                - link "Open NASA NTRS source" [ref=f6e168] [cursor=pointer]:
