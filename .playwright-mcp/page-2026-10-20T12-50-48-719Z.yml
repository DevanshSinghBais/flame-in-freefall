                - link "Open NASA NTRS source" [ref=f6e240] [cursor=pointer]:
                  - /url: https://ntrs.nasa.gov/citations/20010074014
            - listitem [ref=f6e244]:
              - generic [ref=f6e245]:
                - paragraph [ref=f6e246]:
                  - generic [ref=f6e247]: NASA NTRS ID 19990054042
                  - generic [ref=f6e248]: Conference Paper
                - heading [level=3] [ref=f6e249]:
                  - link "Ignition, Transition, Flame Spread in Multidimensional Configurations in Microgravity" [ref=f6e250] [cursor=pointer]:
                    - /url: /research/19990054042
                - paragraph [ref=f6e251]: In the inhabited quarters of orbiting spacecraft, fire is a greatly feared hazard. Thus, the fire safety strategy in a spacecraft is (1) to keep any fire as small as possible, (2) to detect any fire as early as possible, and (3) to extinguish any fire as quickly as possible. This suggests that a material which undergoes a momentary ignition might be tolerable but a material which permits a transition from a localized ignition to flame spread would significantly increase the fire hazard in a spacecraft. If the transition does not take place, fire growth does not occur. Therefore, it is critical to understand what process controls the transition. Many previous works have studied ignition and flame spread separately or were limited to a two-dimensional configuration. In this study, time-dependent phenomena of the transition over a thermally thin sample is studied experimentally and theoretically in two- and three-dimensional (2D,3D) configurations. Furthermore, localized ignition can be initiated at the center portion of thermally thin paper sample instead of at one end of the sample. Thus, the transition to flame spread could occur either toward upstream or downstream or both directions simultaneously with an external flow. In this presentation, the difference in the transition between the 3D and 2D configurations is explained with the numerically calculated data. For sufficiently narrow samples edge effects exist. Some results on this issue are presented. New analysis of the surface smoldering experiments conducted in the space shuttle STS-75 flight is also described.
                - paragraph [ref=f6e252]: Kashiwagi, Takashi; Mell, William E.; Baum, Howard R.; Olson, Sandra
                - generic [ref=f6e253]:
                  - generic [ref=f6e254]: NASA NTRS ID 19990054042
                  - generic [ref=f6e255]: Conference Paper
                  - generic [ref=f6e256]: 1999-05-01
                  - generic [ref=f6e257]: Glenn Research Center
                - link "Open NASA NTRS source" [ref=f6e258] [cursor=pointer]:
                  - /url: https://ntrs.nasa.gov/citations/19990054042
            - listitem [ref=f6e262]:
              - generic [ref=f6e263]:
                - paragraph [ref=f6e264]:
                  - generic [ref=f6e265]: NASA NTRS ID 20040053565
                  - generic [ref=f6e266]: Conference Paper
                - heading [level=3] [ref=f6e267]:
                  - link "Localized Ignition And Subsequent Flame Spread Over Solid Fuels In Microgravity" [ref=f6e268] [cursor=pointer]:
                    - /url: /research/20040053565
                - paragraph [ref=f6e269]: Localized ignition is initiated by an external radiant source at the middle of a thin solid sheet under external slow flow, simulating fire initiation in a spacecraft with a slow ventilation flow. Ignition behavior, subsequent transition simultaneously to upstream and downstream flame spread, and flame growth behavior are studied theoretically and experimentally. There are two transition stages in this study; one is the first transition from the onset of the ignition to form an initial anchored flame close to the sample surface, near the ignited area. The second transition is the flame growth stage from the anchored flame to a steady fire spread state (i.e. no change in flame size or in heat release rate) or a quasi-steady state, if either exists. Observations of experimental spot ignition characteristics and of the second transition over a thermally thin paper were made to determine the effects of external flow velocity. Both transitions have been studied theoretically to determine the effects of the confinement by a relatively small test chamber, of the ignition configuration (ignition across the sample width vs spot ignition), and of the external flow velocity on the two transitions over a thermally thin paper. This study is currently extending to two new areas; one is to include a thermoplastic sample such poly(methymethacrylate), PMMA, and the other is to determine the effects of sample thickness on the transitions. The recent results of these new studies on the first transition are briefly reported.
                - paragraph [ref=f6e270]: Kashiwagi, T.; Nakamura, Y.; Prasad, K.; Baum, H.; Olson, S.; Fujita, O.; Nishizawa, K.; Ito, K.
                - generic [ref=f6e271]:
                  - generic [ref=f6e272]: NASA NTRS ID 20040053565
                  - generic [ref=f6e273]: Conference Paper
                  - generic [ref=f6e274]: 2003-08-01
                  - generic [ref=f6e275]: Glenn Research Center
                - link "Open NASA NTRS source" [ref=f6e276] [cursor=pointer]:
                  - /url: https://ntrs.nasa.gov/citations/20040053565
            - listitem [ref=f6e280]:
              - generic [ref=f6e281]:
                - paragraph [ref=f6e282]:
                  - generic [ref=f6e283]: NASA NTRS ID 20000005011
                  - generic [ref=f6e284]: Conference Paper
                - heading [level=3] [ref=f6e285]:
                  - link "Ultrasound Imaging System Implementation and Ignition Protocol for the Microgravity Smoldering Combustion (MSC) Experiments" [ref=f6e286] [cursor=pointer]:
                    - /url: /research/20000005011
                - paragraph [ref=f6e287]: The Microgravity Smoldering Combustion (MSC) experiment is a study of the smolder characteristics of porous combustible materials in a microgravity environment. The objective of the study is to provide a better understanding of the controlling mechanisms of smolder, both in microgravity and normal earth gravity. Experiments have been conducted aboard the NASA Space Shuttle in the Get Away Special Canister (GAS-CAN), an apparatus requiring completely remote operation. Future GAS-CAN experiments will utilize an ultrasound imaging system (UIS) which has been incorporated into the MSC experimental apparatus. Thermocouples are currently used to measure temperature and reaction front velocities. A less intrusive method is desirable, however, as smolder is a very weak reaction and it has been found that heat transfer along the thermocouple is sufficient to affect the smolder reaction. It is expected that the UIS system will eventually replace the existing array of thermocouples as a non-intrusive technique without compromising data acquisition. The UIS measures line of sight permeability, providing information about the reaction front position and extent. Additionally, the ignition sequence of the MSC experiments has been optimized from previous experiments to provide longer periods of self-supported smolder. An ignition protocol of a fixed power to the igniter for a fixed time is now implemented. This, rather than a controlled temperature profile ignition protocol at the igniter surface, along with the UIS system, will allow for better study of the effect of gravity on a smolder reaction.
                - paragraph [ref=f6e288]: Walther, David C.; Anthenien, Ralph A.; Roslon, Mark; Fernandez-Pello, A. Carlos; Urban, David L.
