            - listitem [ref=f6e208]:
              - generic [ref=f6e209]:
                - paragraph [ref=f6e210]:
                  - generic [ref=f6e211]: NASA NTRS ID 19990053973
                  - generic [ref=f6e212]: Conference Paper
                - heading [level=3] [ref=f6e213]:
                  - 'link "Flow Effects on the Flammability Diagrams of Solid Fuels: Microgravity Influence on Ignition Delay" [ref=f6e214] [cursor=pointer]':
                    - /url: /research/19990053973
                - paragraph [ref=f6e215]: The possibility of an accidental fire in space-based facilities is a primary concern of space exploration programs. Spacecraft environments generally present low velocity air currents produced by ventilation and heating systems (of the order of 0.1 m/s), and fluctuating oxygen concentrations around that of air due to CO2 removal systems. Recent experiments of flame spread in microgravity show the spread rate to be faster and the limiting oxygen concentration lower than in normal-gravity. To date, there is not a material flammability-testing protocol that specifically addresses issues related to microgravity conditions. The present project (FIST) aims to establish a testing methodology that is suitable for the specific conditions of reduced gravity. The concepts underlying the operation of the LIFT apparatus, ASTM-E 1321-93, have been used to develop the Forced-flow Ignition and flame-Spread Test (FIST). As in the LIFT, the FIST is used to obtain the flammability diagrams of the material, i.e., graphs of ignition delay time and flame spread rate as a function of the externally applied radiant flux, but under forced flow rather than natural convection conditions, and for different oxygen concentrations. Although the flammability diagrams are similar, the flammability properties obtained with the FIST are found to depend on the flow characteristics. A research program is currently underway with the purpose of implementing the FIST as a protocol to characterize the flammability performance of solid materials to be used in microgravity facilities. To this point, tests have been performed with the FIST apparatus in both normal-gravity and microgravity conditions to determine the effects of oxidizer flow characteristics on the flammability diagrams of polymethylmethacrylate (PMMA) fuel samples. The experiments are conducted at reduced gravity in a KC- 135 aircraft following a parabolic flight trajectory that provides up to 25 seconds of low gravity. The objective of the experiments is to obtain data of ignition delay and flame spread rate at low flow velocities (0.1 to 0.2 m/s), which cannot be obtained under normal gravity because of the natural convection induced flows (approx. 0.5 m/s). Due to the limited reduced gravity time, the data can only be obtained for high radiant fluxes, and are consequently limited in scope. These tests do, however, provide insight into the flammability diagram characteristics at low velocity and reduced gravity, and also into the implications of the flow-dependence of the flammability properties under environments similar to those encountered in space facilities.
                - paragraph [ref=f6e216]: Cordova, J. L.; Walther, D. C.; Fernandez-Pello, A. C.; Steinhaus, T.; Torero, J. L.; Quintere, J. G.; Ross, H. D.
                - generic [ref=f6e217]:
