            - listitem [ref=f6e226]:
              - generic [ref=f6e227]:
                - paragraph [ref=f6e228]:
                  - generic [ref=f6e229]: NASA NTRS ID 20010074014
                  - generic [ref=f6e230]: Conference Paper
                - heading [level=3] [ref=f6e231]:
                  - link "Multidimensional Effects on Ignition, Transition, and Flame Spread in Microgravity" [ref=f6e232] [cursor=pointer]:
                    - /url: /research/20010074014
                - paragraph [ref=f6e233]: Localized ignition is initiated by an external radiant source at the middle of a thermally thin sample under external slow flow, simulating fire initiation in a spacecraft with a slow ventilation flow. Two ignition configurations are simulated, one across the sample surface creating a line shaped flame front (two-dimensional, 2-D, configuration) and the other a small circular ignition (three-dimensional, 3-D, configuration). Ignition, subsequent transition to simultaneously upstream and downstream flame spread, and flame growth behavior are studied experimentally and theoretically. Details of our theoretical models and numerical techniques can be found in previous publications. The effects of the sample width on the transition and subsequent flame spread, and flame spread along open edges of a thermally thin paper sample are determined. Experimental observations of flame spread phenomena were conducted in the 10 s drop tower and also on the space shuttle STS-75 flight to determine the effects of oxygen concentration and external flow velocity on flame spread rate and flame growth pattern. Finally, effects of confinement in a small test chamber on the transition and subsequent flame spread are examined. The results of these studies are briefly reported.
                - paragraph [ref=f6e234]: Kashiwagi, T.; Mell, W. E.; Nakamura, Y.; Olson, S. L.; Baum, H. R.; McGrattan, K. B.
                - generic [ref=f6e235]:
