                  - generic [ref=f6e193]: NASA NTRS ID 20010074015
                  - generic [ref=f6e194]: Conference Paper
                - heading [level=3] [ref=f6e195]:
                  - link "Theoretical Prediction of Microgravity Ignition Delay of Polymeric Fuels in Low Velocity Flows" [ref=f6e196] [cursor=pointer]:
                    - /url: /research/20010074015
                - paragraph [ref=f6e197]: A new flammability apparatus and protocol, FIST (Forced Flow Ignition and Flame Spread Test), is under development. Based on the LIFT (Lateral Ignition and Flame Spread Test) protocol, FIST better reflects the environments expected in spacebased facilities. The final objective of the FIST research is to provide NASA with a test methodology that complements the existing protocol and provides a more comprehensive assessment of material flammability of practical materials for space applications. Theoretical modeling, an extensive normal gravity data bank and a few validation space experiments will support the testing methodology. The objective of the work presented here is to predict the ignition delay and critical heat flux for ignition of solid fuels in microgravity at airflow velocities below those induced in normal gravity. This is achieved through the application of a numerical model previously developed of piloted ignition of solid polymeric materials exposed to an external radiant heat flux. The model predictions will provide quantitative results about ignition of practical materials in the limiting conditions expected in space facilities. Experimental data of surface temperature histories and ignition delay obtained in the KC-135 aircraft are used to determine the critical pyrolysate mass flux for ignition and this value is subsequently used to predict the ignition delay and the critical heat flux for ignition of the material. Surface temperature and piloted ignition delay calculations for Polymethylmethacrylate (PMMA) and a Polypropylene/Fiberglass (PP/GL) composite were conducted under both reduced and normal gravity conditions. It was found that ignition delay times are significantly shorter at velocities below those induced by natural convection.
                - paragraph [ref=f6e198]: Fernandez-Pello, A. C.; Torero, J. L.; Zhou, Y. Y.; Walther, D.; Ross, H. D.
                - generic [ref=f6e199]:
                  - generic [ref=f6e200]: NASA NTRS ID 20010074015
                  - generic [ref=f6e201]: Conference Paper
                  - generic [ref=f6e202]: 2001-05-01
                  - generic [ref=f6e203]: Glenn Research Center
                - link "Open NASA NTRS source" [ref=f6e204] [cursor=pointer]:
