    - heading "Combustion, seen in a different flow." [level=1] [ref=f2e12]
    - paragraph [ref=f2e13]: Gravity shapes the way hot gases move around a flame. Studying flames in microgravity changes that flow environment and gives researchers a way to examine combustion behavior under different conditions.
