          - heading "Earth and microgravity" [level=2] [ref=f2e18]
        - generic [ref=f2e19]: Illustrative visualization
      - paragraph [ref=f2e21]: On Earth, gravity-driven buoyant convection shapes a candle flame into a teardrop and carries soot toward its tip. In microgravity, with convective flows absent, NASA describes a spherical, soot-free, blue flame.
