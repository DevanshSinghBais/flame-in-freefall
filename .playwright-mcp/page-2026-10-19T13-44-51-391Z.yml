      - paragraph [ref=f2e54]: NASA’s Advanced Combustion via Microgravity Experiments (ACME) includes studies of gaseous flames conducted in the Combustion Integrated Rack aboard the International Space Station. The mission page describes research goals that include improved fuel efficiency, reduced pollutant production, and spacecraft fire prevention through materials-flammability research.
